<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>历史上的今天 · 2026 日历</title>
<meta name="description" content="一份可以分享的电子日历：2026 年每一天，都配有一件历史大事和一句诗词或名言。">
<style>
  :root{
    --ink:#20242c; --ink-2:#565d6b; --ink-3:#8d95a3;
    --line:#e7e2d7; --paper:#f6f3ea; --card:#fffdf8;
    --red:#b0312c; --red-soft:#f4e4df; --gold:#a8834a;
    --shadow:0 1px 2px rgba(32,36,44,.035),0 10px 30px -16px rgba(32,36,44,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,serif;
    background:var(--paper);color:var(--ink);min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(rgba(168,131,74,.06) 1px, transparent 1px);
    background-size:22px 22px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:32px 22px 64px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:14px}
  .seal{width:46px;height:46px;border-radius:9px;background:var(--red);color:#fff;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    font-size:13px;line-height:1.08;letter-spacing:1px;font-weight:600;
    box-shadow:0 8px 18px -10px rgba(176,49,44,.8);flex:0 0 auto}
  h1{margin:0;font-size:25px;font-weight:600;letter-spacing:2px}
  .sub{margin:6px 0 0;font-size:12.5px;color:var(--ink-3);letter-spacing:.8px}
  .head-actions{display:flex;gap:8px;flex-wrap:wrap}

  button{font-family:inherit;cursor:pointer}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink-2);
    padding:8px 14px;border-radius:999px;font-size:13px;letter-spacing:.5px;
    transition:.18s;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:#cfc6b4;color:var(--ink);background:#fff;transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{background:#333a46}

  .grid{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(330px,.88fr);gap:22px;align-items:start}

  .cal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 20px 14px;box-shadow:var(--shadow)}
  .cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
  .month-title{display:flex;align-items:baseline;gap:9px}
  .month-title .m{font-size:30px;font-weight:600;letter-spacing:1px}
  .month-title .y{font-size:13px;color:var(--ink-3);letter-spacing:2px}
  .nav{display:flex;gap:6px;align-items:center}
  .nav button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;
    color:var(--ink-2);font-size:14px;line-height:1;display:grid;place-items:center;transition:.16s;padding:0}
  .nav button:hover{background:var(--ink);border-color:var(--ink);color:#fff}
  .nav .today{width:auto;padding:0 13px;border-radius:999px;font-size:12.5px;letter-spacing:1px}

  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .weekdays span{text-align:center;font-size:11.5px;color:var(--ink-3);letter-spacing:2px;padding:4px 0}
  .weekdays span.wk{color:#b0574f}

  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .day{position:relative;aspect-ratio:1/1.04;border-radius:10px;border:1px solid transparent;
    background:#fbf9f3;padding:7px 6px 5px;display:flex;flex-direction:column;align-items:flex-start;
    transition:.15s;text-align:left;overflow:hidden}
  .day:hover{background:#fff;border-color:#ded6c5;transform:translateY(-1px)}
  .day .num{font-size:16px;font-weight:600;line-height:1.1;letter-spacing:.5px}
  .day .sub-info{font-size:10px;color:var(--ink-3);margin-top:3px;letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .day .fest{font-size:10px;color:var(--gold);margin-top:auto;letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .day .fest.red{color:var(--red)}
  .day .dot{position:absolute;right:7px;top:9px;width:3px;height:3px;border-radius:50%;background:#cdb78f}
  .day.other{opacity:.3}
  .day.wk .num{color:#9a4a42}
  .day.is-today{border-color:var(--red);background:var(--red-soft)}
  .day.is-today .num{color:var(--red)}
  .day.sel{background:var(--ink);border-color:var(--ink)}
  .day.sel .num,.day.sel .sub-info,.day.sel .fest,.day.sel .fest.red{color:#fff}
  .day.sel .sub-info{opacity:.72}
  .day.sel .dot{background:#fff;opacity:.6}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);overflow:hidden;position:sticky;top:20px}
  .panel-head{padding:20px 22px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fffefb,#fbf8f0)}
  .d-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .d-date{font-size:42px;font-weight:600;line-height:1;letter-spacing:1px}
  .d-meta{margin-top:10px;font-size:12.5px;color:var(--ink-2);letter-spacing:.5px;display:flex;flex-wrap:wrap;gap:6px}
  .d-meta .tag{background:#f1ece0;color:#7a6a4f;border-radius:4px;padding:2px 7px;font-size:11px}
  .d-meta .tag.fest{background:var(--red-soft);color:var(--red)}
  .d-wd{font-size:12.5px;color:var(--ink-3);letter-spacing:2px;padding-top:8px;white-space:nowrap}

  .panel-body{padding:4px 22px 18px;max-height:min(58vh,640px);overflow:auto}
  .panel-body::-webkit-scrollbar{width:6px}
  .panel-body::-webkit-scrollbar-thumb{background:#e4dece;border-radius:6px}

  .sec-title{font-size:11.5px;letter-spacing:3px;color:var(--ink-3);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
  .sec-title:before{content:"";width:14px;height:1px;background:var(--gold);display:block}

  /* 今日小故事 */
  .story{margin:14px 0 4px;padding:18px 18px 16px;border-radius:12px;position:relative;
    background:linear-gradient(160deg,#fdf6f1 0%,#fbf7ee 55%,#f8f4ea 100%);
    border:1px solid #efe3d5}
  .story:before{content:"“";position:absolute;top:2px;left:12px;font-size:56px;line-height:1;
    color:rgba(176,49,44,.13);font-family:Georgia,serif}
  .story-kicker{font-size:10.5px;letter-spacing:3px;color:#b07a52;display:flex;align-items:center;gap:7px;position:relative}
  .story-kicker i{width:5px;height:5px;border-radius:50%;background:var(--red);display:inline-block;font-style:normal}
  .story-title{font-size:16.5px;font-weight:600;letter-spacing:1px;margin:9px 0 8px;color:#2a2f37;position:relative;line-height:1.5}
  .story-text{font-size:14px;line-height:2;letter-spacing:.5px;color:#3a4049;position:relative;text-align:justify}
  .story-text::first-letter{font-size:1.02em}
  .story-foot{margin-top:10px;padding-top:8px;border-top:1px dashed #ecdcc9;font-size:11px;color:#b0a290;
    display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:.5px}
  .story-foot .pick{cursor:pointer;color:#a8834a;border-bottom:1px dashed #d9c39d;padding-bottom:1px}
  .story-foot .pick:hover{color:var(--red);border-color:var(--red)}

  .ev{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed #ece6d9}
  .ev:last-child{border-bottom:0}
  .ev .yr{font-size:12.5px;font-weight:600;color:var(--red);min-width:54px;letter-spacing:0;padding-top:1px;white-space:nowrap}
  .ev .tx{font-size:13.5px;line-height:1.7;color:#33383f}
  .ev .cat{font-size:10px;color:#9b8d76;border:1px solid #e9e2d3;border-radius:3px;padding:0 4px;margin-left:6px;white-space:nowrap;vertical-align:1px}

  .quote{margin:10px 0 0;padding:16px 18px;border-left:2px solid var(--red);
    background:linear-gradient(90deg,#fbf2ee,#fffdfa);border-radius:0 9px 9px 0}
  .quote p{margin:0;font-size:15px;line-height:1.95;letter-spacing:.8px;color:#2b3037}
  .quote cite{display:block;margin-top:8px;font-style:normal;font-size:12px;color:var(--ink-3);letter-spacing:.8px}

  .panel-foot{padding:12px 22px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}

  .today-strip{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 22px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
  .ts-label{font-size:12px;letter-spacing:2px;color:var(--red);white-space:nowrap;padding-top:2px}
  .ts-text{font-size:13.5px;line-height:1.85;color:#33383f;flex:1;min-width:220px}
  .ts-text b{font-weight:600;color:var(--ink)}
  .ts-text .src{color:var(--ink-3);font-size:12.5px}

  footer{margin-top:32px;text-align:center;font-size:11.5px;color:#a9a196;line-height:2;letter-spacing:.6px}
  footer .sep{color:#d8d0bf;margin:0 8px}

  /* 分享卡片舞台 */
  .card-stage{position:fixed;left:-10000px;top:0;width:720px;height:1280px;pointer-events:none;z-index:-1}
  .share-card{width:720px;height:1280px;background:#f7f4ec;padding:54px 56px 46px;
    display:flex;flex-direction:column;position:relative;overflow:hidden;
    font-family:"Songti SC","Noto Serif SC","SimSun",serif;color:#20242c}
  .share-card:before{content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(168,131,74,.09) 1px, transparent 1px);background-size:20px 20px}
  .sc-frame{position:absolute;inset:24px;border:1px solid rgba(168,131,74,.36);border-radius:3px;pointer-events:none}
  .sc-frame:after{content:"";position:absolute;inset:7px;border:1px solid rgba(168,131,74,.14);border-radius:2px}
  .sc-inner{position:relative;display:flex;flex-direction:column;height:100%}
  .sc-brand{display:flex;align-items:center;gap:12px}
  .sc-brand .s{width:40px;height:40px;background:#b0312c;color:#fff;border-radius:7px;display:grid;place-items:center;
    font-size:11.5px;line-height:1.1;text-align:center;letter-spacing:1px}
  .sc-brand .t{font-size:13px;letter-spacing:4px;color:#7c8492}

const STORY    = {"0101":["元旦差点没过成","1912 年 1 月 1 日，孙中山就任临时大总统，顺便宣布改用公历。消息传出，全国人民集体懵了：说好的过年呢？于是那一年，中国出现了「官方新年」和「民间新年」两个年，鞭炮厂成为最大赢家——反正两头都得多买。"],"0102":["一个人名下的两块大陆","哥伦布到死都以为自己到了亚洲，所以加勒比海岛屿被他称作「西印度群岛」。真正意识到那是一片新大陆的，是佛罗伦萨人亚美利哥·韦斯普奇。1507 年，制图师把他的名字写上了地图——美洲，从此以一个会计的名字命名。"],"0103":["嫦娥四号落在了谁都看不见的地方","2019 年 1 月 3 日，嫦娥四号在月球背面着陆。因为没有视线，它无法和地球直接通信，必须先放一颗中继卫星在拉格朗日点转述信号。人们在屏幕上看到「着陆成功」的那几秒，信息其实已经多绕了四十万公里。"],"0104":["牛顿的「第二职业」","1696 年，物理学家牛顿转行当皇家造币厂厂长，从此科学发展慢了，伪币贩子遭殃了。这位发现万有引力的天才，把假币犯一个个送上法庭，比打击苹果高效多了。有人统计：牛顿抓的伪币犯比他写的论文还多。"],"0105":["一盏灯的「不可能任务」","1974 年，捷克小镇胡克瓦尔迪装了一盏路灯，本想测测灯泡寿命。结果测试组忘了关，小镇也懒得管，这盏灯一亮就是几十年。灯泡厂倒闭了，小镇改名了，它还在亮。人类史上最敬业的员工，没有之一。"],"0106":["电报：史上第一条「短信」","1844 年 1 月 6 日，莫尔斯拍出人类第一封电报：「上帝创造了何等奇迹。」翻译一下：我这玩意儿真管用，快夸我。这条信息费按字符算的话，大概相当于今天发一条微博外加一年的流量费。"],"0107":["伽利略看见了不该看见的东西","1610 年 1 月 7 日夜里，伽利略把望远镜对准木星，发现旁边有三个小亮点，第二天又多出一个。它们夜夜移动，却始终绕着木星。他意识到：不是所有天体都绕地球转。这一眼，把「地球是宇宙中心」的墙敲出了裂缝。"],"0108":["最后一位帝师的一天","1976 年 1 月 8 日，周恩来去世。身边人整理遗物，发现他的衬衫袖口磨破了一圈，换过领子的旧衬衣还在穿，睡衣上打了十几块补丁。工作人员商量要不要给他换新衣，最后决定：不换了，就让他穿平常的衣服走。"],"0109":["史上最强「简历造假」","1908 年，一个叫弗雷德里克·库克的美国医生宣布登顶北极，举国欢腾，印成邮票。结果同行一看他的测量数据，笑了：这路线数学上就走不通。库克从此身败名裂，成了探险史上最著名的「PPT 登山家」——全靠嘴。"],"0110":["地铁首日：呛得有滋有味","1863 年 1 月 10 日，伦敦地铁通车，用的还是蒸汽机车。乘客们顶着满车厢的煤烟，呛出了眼泪，还是坚持天天坐。记者问为什么不嫌弃，一位老先生回答：「总比在马路边吸马粪强。」这就是英国人的乐观。"],"0111":["第一个飞越太平洋的女人","1935 年 1 月 11 日，阿梅莉亚·埃尔哈特从夏威夷起飞，独自飞向加州，全程十八小时。她不敢带降落伞，为的是多装一点油。落地后她只说了句：「我看过了云上的日出，很美。」记者追问意义，她摇头：「我只是想飞。」"],"0112":["从海盗到畅销书作家","杰克·伦敦年轻时当过「牡蛎海盗」——半夜开船去别人养殖场偷牡蛎，后来觉得危险，改行写小说。结果发现写作更危险：稿费不保证，还脱发。好在他把海盗经历全写进了书里，稿费比偷牡蛎赚多了。"],"0113":["左拉的那封信叫《我控诉》","1898 年 1 月 13 日，左拉在报纸头版连喊三次「我控诉」，为一名被判叛国的犹太军官德雷福斯申冤。一天之内报纸卖出三十万份，他也随即被判诽谤罪流亡英国。十二年后德雷福斯平反，左拉已去世四年，没能看见。"],"0114":["卡萨布兰卡的「无条件投降」","1943 年 1 月 14 日，罗斯福在卡萨布兰卡会议上提出：轴心国必须无条件投降。他后来回忆，这话其实是他一拍脑袋想出来的——出发前从没跟任何人商量过。丘吉尔听完皱眉，却也只能点头。战后德国的命运，就这样被一句话定了调。"],"0115":["一句即兴演讲救了全场","1963 年，马丁·路德·金上台前拿着讲稿，讲到一半忽然把稿子一放，开始讲「我有一个梦想」。助手在台下急疯了：说好的念稿呢？可二十万人一听就沸腾了。史上最强「脱稿事故」，再也没有人敢让他照稿念。"],"0116":["女王想看福斯塔夫谈恋爱","1600 年前后，《亨利四世》在伦敦上演，剧中的福斯塔夫是个又胖又赖的骗子，观众却特别喜欢他。据说伊丽莎白女王看完后说：「我想看看这位爵士谈恋爱的样子。」莎士比亚于是赶写了《温莎的风流娘儿们》，让这个胖子在被捉弄中过完了整场戏。"],"0117":["富兰克林的简历","富兰克林的正式头衔有：科学家、外交家、作家、政治家。但他给自己写的墓志铭是「印刷工」。也就是说，这位出现在一百美元上的男人，自我介绍时最想说的职业是「在印刷厂打工的」。顶级凡尔赛，两百多年了。"],"0118":["库克船长看见了什么","1778 年 1 月 18 日，库克抵达夏威夷。他在日志里写：当地人从没见过这么大的船，也有记载说他们跪倒在地。库克不许手下接受任何馈赠，还立规矩禁止伤害当地人。一年后，他死在这些人的手里，因为一次争执，因为一条船。"],"0119":["一只乌鸦救了房东","爱伦·坡写《乌鸦》时穷得叮当响，一首诗赚了九美元。他要是知道这首诗今天还被印在杯子和 T 恤上，大概会气得从棺材里坐起来喊：「版权费呢？」文学史上最亏的一笔买卖，就是他把《乌鸦》的版权卖了。"],"0120":["喝咖啡的年轻人","1924 年 1 月 20 日，广州的会场里挤满人，一个穿中山装的年轻人在笔记本上飞快地记。会后他问前辈：「农民到底是怎样的？」有人说，中国革命的问题，最终要由农民来回答。这个人叫毛泽东，那年他三十岁。"],"0121":["一封没寄出的信","1924 年 1 月 21 日，列宁去世。临终前，他口述过一封没寄出的信，叫《给代表大会的信》，里面批评了几位政治局委员。他妻子坚持让秘书保留原件，说「万一哪天有用」。三十年后的苏共二十大上，这封信被人拿出来，念出了那些句子。"],"0122":["女王与她的印度仆人","1887 年，维多利亚女王生日那天，一位印度仆人给她送上一碗生米。女王问这是什么意思，随从说：这是印度人对「吃饱吧」的祝福。此后十年，宫廷里多了一名印度籍教师，专门教她乌尔都语，她写了十三本笔记。"],"0123":["大地震前的兆","1556 年 1 月 23 日，陕西华县地震，史称「华县大地震」，死难者超过八十万。当地志里写过震前的怪事：井水突然翻滚，牛马不肯回圈，老鼠成群过街。四百多年后的今天，科学家仍在研究那些看似荒野的「前兆」。"],"0124":["苹果最贵的「砸电视」广告","1984 年，苹果为 Macintosh 电脑买了一整版超级碗广告：一个女人抡锤子砸大屏幕。全美国都看懵了：这是卖电脑还是卖锤子？但第二天所有人都记住了苹果。乔布斯的营销哲学：宁可让大家看不懂，也不能让大家看不见。"],"0125":["苏格兰的「法定醉酒日」","每年 1 月 25 日，苏格兰人吃羊肚、喝威士忌、念彭斯的诗，纪念这位只活了三十七年的诗人。别的国家用法定假日纪念政治家，苏格兰用法定聚餐纪念诗人。诗写到这个份上，值了。"],"0126":["船与囚徒","1788 年 1 月 26 日，第一支舰队驶入悉尼港，船上载着七百多名囚犯。他们中很多人只是因为偷了一块面包被判流放，到了这片大陆反而获得了土地。澳大利亚国庆日，纪念的就是这艘载着囚犯的船靠岸的那一天。"],"0127":["奥斯维辛解放那天","1945 年 1 月 27 日，苏军士兵冲进奥斯维辛，找到了几千名奄奄一息的幸存者。有人回忆，一个士兵看到囚犯时哭了——他后来承认，那是他这辈子第一次在俘虏面前掉眼泪。狱卒没能毁掉所有人，这就是胜利。"],"0128":["她给孩子们留了一句话","1986 年 1 月 28 日，挑战者号升空七十三秒后爆炸。机上有位中学教师麦考利夫，她是第一个进入太空的普通公民。起飞前有人问她怕不怕，她说：「我这么做，是为了让我的学生触碰未来。」她的学生那天都在看电视直播，后来很多人成了工程师。"],"0129":["契诃夫的「双重生活」","契诃夫白天给人看病，晚上写小说，还得抽空吐槽剧院。他说：「医学是我的妻子，文学是我的情人。」翻译一下：正宫是稳定的收入，业余才是真爱。这话放在今天，依然是无数打工人的心声。"],"0130":["一场只有六年的共和国","1933 年 1 月 30 日，希特勒被任命为德国总理。魏玛宪法号称当时最民主的宪法，却允许总统在无议会同意时任命总理。柏林一家报馆的编辑当晚写道：我们换掉了一位总理，也换掉了一个国家。"],"0131":["进城那天，他在干什么","1949 年 1 月 31 日北平和平解放，军队进城。曾有战地记者回忆，那天城门口有位老人捧着一碗水递上来，说「北平没打坏，太好了」。故宫里，守夜的人终于能睡一个整觉，三千年古都躲过了一场炮火。"],"0201":["三百年前的那个收复瞬间","1662 年 2 月 1 日，郑成功在台湾赤嵌楼接受荷兰人投降。荷兰人交出城堡后在协议上签字，要求「保留带走财物与奏乐离场」的权利。郑成功答应了。当地百姓看着降旗缓缓落下，那年郑成功三十八岁，病逝前一年。"],"0202":["一座城的雪","1943 年 2 月 2 日，斯大林格勒的德第六集团军投降。保卢斯被俘那天，苏军士兵冲进他的指挥部，看见墙上挂着一幅柏林地图，桌上一支钢笔，旁边是没写完的家书。二十万德军进了包围圈，最后回国的不到六千人。"],"0203":["门德尔松的婚礼进行曲","1843 年，门德尔松为莎士比亚《仲夏夜之梦》配乐，其中一段成了后世所有婚礼的进场曲。有趣的是，他自己结婚时没用这首。他只在婚礼上弹了一首很短的管风琴曲，然后悄悄对妻子说：这首曲子是专门写给今天的。"],"0204":["雅尔塔的那张合影","1945 年 2 月 4 日，雅尔塔会议在沙皇的旧宫殿里开幕。三巨头落座时，工作人员摆了三张椅子。照片上，罗斯福坐中间，丘吉尔和斯大林分坐两侧——这张椅子摆法，后来被人反复研究：它暗示了战后世界的座次。"],"0205":["换日历的头一年","1912 年 2 月 5 日，民国政府开始使用公历。可旧历新年还是那么热闹，各地报纸一边宣传「新历年」，一边悄悄登着「旧历年货广告」。一位上海商人在日记里写：政府不过旧年，我们照过。那年春节，街上的鞭炮卖得最火。"],"0206":["女王的加冕与那个「她」","1952 年 2 月 6 日，英王乔治六世去世，二十五岁的伊丽莎白在肯尼亚的一间树屋旅馆里，得知自己成了女王。她当即停止行程，返回伦敦。那一年她说过一句很冷静的话：「我的一生，无论长短，都将奉献给你们。」七十年后，她做到了。"],"0207":["狄更斯的「流水线」人生","狄更斯每天上午写作，下午散步，晚上社交，作息精确得像闹钟。有人问他灵感从哪来，他说：「灵感？我等到它来的时候，已经写完三章了。」说白了：别等灵感，灵感也在等你先动笔。"],"0208":["扔进火炉的书稿","凡尔纳的《气球上的五星期》被十六家出版社拒绝，他气得把稿子扔进壁炉。妻子眼疾手快抢救出来。第十七家出版社不但出版了，还和他签了二十年合约。后来他写了《海底两万里》《八十天环游地球》，全靠老婆当年手快。"],"0209":["四个英国人吓坏了美国","1964 年 2 月 9 日，披头士第一次上美国电视，七千三百万人围观。四个利物浦青年的发型让美国家长恐慌，让他们集体写信抗议。孩子们不在乎，第二天全国理发店都被挤爆了。英伦入侵，从发型开始。"],"0210":["巴格达的书","1258 年 2 月 10 日，蒙古军队攻入巴格达。史书记载，底格里斯河的水被墨染黑了——城里的图书馆被推入河中，据说书页多到可以让马踏过去。一座城的智慧，一夜之间变成了河里的颜色。"],"0211":["曼德拉的「迟到」出狱","1990 年 2 月 11 日，全世界都在等曼德拉出狱，电视台架好了机器。结果他迟到了——不是闹脾气，是他出狱前坚持要洗个澡、梳好头发，漂漂亮亮地走出来。坐了二十七年牢，出门前还是要帅。这就是段位。"],"0212":["退位诏书上的三个字","1912 年 2 月 12 日，清帝退位诏书颁布。诏书由张謇起草，其中有句「即由袁世凯组织临时政府」，这一句让袁世凯得了大位。据说诏书送到隆裕太后手里时，她哭了很久，问身边人：「共和是什么？」没人答得上来。"],"0213":["被审判的老人","1633 年 2 月 13 日，伽利略抵达罗马接受审讯。他已经六十九岁，身体虚弱。审判官要求他跪着宣读悔过书，据说他起身时低声嘟囔了一句：「可它仍在转。」这句话是否真说过，史家至今争论不休。"],"0214":["情人节的前身是「相亲会」","中世纪的欧洲，2 月 14 日本来是「抽签配对日」：单身男女写名字放进罐子，抽到谁就和谁约会一年。后来教会觉得太随意，改成了纪念圣瓦伦丁。但抽签这个环节，被现代相亲 App 完美继承了。"],"0215":["在比萨斜塔上扔下的东西","传说伽利略在比萨斜塔上扔过两个铁球，证明重的和轻的同时落地。这个故事很可能不是真的，史料没有任何记录。但他确实做过斜面实验，用滚球代替自由落体，一算就是几十年。科学史上很多著名的故事，其实是后来的人编的。"],"0216":["打开一扇封了三千年的门","1923 年 2 月 16 日，考古学家卡特凿开图坦卡蒙墓的门，举着蜡烛往里看。有人问他看见了什么，他说：「我看见了奇妙的东西。」墓里一堆黄金、一张金面具、一具少年法老的木乃伊。那年他四十八岁，此后十年都在整理这间屋子。"],"0217":["火刑柱前的布鲁诺","1600 年 2 月 17 日，布鲁诺在罗马百花广场被烧死。审判官念完判决，他站起来说：「你们宣判我时的恐惧，比我的恐惧更大。」他坚持宇宙无限、有无数个世界。四百年后，同一条街上立起了他的铜像，面朝梵蒂冈。"],"0218":["拿破仑的「充电宝」","1800 年，伏打做成了世界第一块电池，跑去给拿破仑演示。皇帝看得两眼放光，当场给伏打发奖金、封爵士，还提议「科学应该奖励那些为它增添光彩的人」。说白了：这个会「发电的金属堆」，让军事强人也成了科技粉。"],"0219":["他把地球挪开了","1543 年，哥白尼的《天体运行论》出版，那时他已经卧床不起。据说书送到他手上时，他摸了一下封面就去世了。书里把太阳放在中心，把地球挪到第三轨道——一个教士临终前的这个举动，让人类花了一百年才跟上。"],"0220":["天鹅湖首演砸了","1877 年 2 月 20 日，《天鹅湖》在莫斯科首演，结果惨败。舞者说音乐「太像交响乐，没法跳舞」，评论家说它「冗长」。柴可夫斯基很受伤，此后再没管过这部芭蕾。直到他去世后，别人重新编排，它才成了世界上最著名的芭蕾。"],"0221":["一本小册子的诞生","1848 年 2 月，《共产党宣言》出版，二十三页，没署名。两位作者马克思和恩格斯，一个三十岁一个二十八岁，都不富裕。他们没想到，这本比一本杂志还薄的小册子，日后会被译成两百多种文字。年轻真好，敢想敢写。"],"0222":["华盛顿的「零工资」CEO","1775 年，华盛顿被任命为大陆军总司令，宣布不要工资，只报销「实际开支」。八年后战争结束，他把账本交给议会。议会一看： expenses 报得清清楚楚，一毛不多要。史上最廉洁的 CEO，离任时还把公章还了回去。"],"0223":["第一本印刷的书","1455 年 2 月 23 日前后，古腾堡完成了《四十二行圣经》。他借了钱买设备，最后被告上法庭，输掉官司，印刷设备和一部分书被债主收走。他死时穷困潦倒。可他的活字印刷术，五十年间让欧洲的书从几万册变成两千万册。"],"0224":["消失的十天","1582 年，教皇格里高利十三世改历法，把 10 月 5 日直接跳到 10 月 15 日。欧洲人民一觉醒来，发现日子少了十天，工资照旧、房租照旧，大家忽然觉得这个历法不错。史上唯一一次「时间打折」，还是官方版的。"],"0225":["苹果的对手是「五个人」","1956 年 2 月 25 日，赫鲁晓夫在苏共二十大作秘密报告，抨击斯大林。报告没有公开，但波兰一位记者拿到了一份，转手给了以色列情报机构，再转给美国。几个月后，全文登上《纽约时报》。一份「秘密」，只存在了四个月。"],"0226":["写《悲惨世界》时他在干什么","1862 年，《悲惨世界》出版。雨果写它用了十七年，中间因为政变流亡海外十九年。他在根西岛的房子里写作，书桌上方开了一扇小窗，正对着大海。他说：「我写的是穷人的《圣经》。」出版当天，巴黎的书店被抢购一空。"],"0227":["一把火烧出来的独裁","1933 年 2 月 27 日，德国国会大厦起火。希特勒赶到现场，说这是共产党的阴谋，第二天就签了《国会纵火法令》，取消言论、集会、出版自由。一名荷兰青年被审判，最后无罪释放。可那道法令，一直到纳粹倒台都没被废除。"],"0228":["一间酒吧里的诺贝尔奖","1953 年，沃森和克里克冲进剑桥的鹰酒吧，大喊「我们发现了生命的秘密」。酒吧里没几个人抬头。十年后他们拿诺贝尔奖，那间酒吧从此成了旅游景点——「科学家们喝醉时也可能改变世界」。"],"0229":["四年一次的生日","闰日出生的人，每四年才过一次真正的生日。英国有个家族，三代人都生在 2 月 29 日——概率约为一亿三千万分之一。他们干脆把 2 月 28 日和 3 月 1 日都当作生日，连着庆祝两天，说是「把欠的补回来」。"],"0301":["「OK」的第一次出现","1839 年 3 月 1 日，「OK」一词第一次出现在波士顿一份报纸上，是编辑开的一个拼写玩笑，把「all correct」故意写成「oll korrect」。这个玩笑没过多久就过气了，可这个词活了下来，如今成了全世界使用最广的英语单词。"],"0302":["帝国大厦上的金刚","1933 年 3 月 2 日，《金刚》在纽约首映。那只巨猿爬上帝国大厦的镜头，是用模型和玻璃画合成的。首映当晚，观众看到金刚坠落，影院里有人尖叫。那年纽约刚经历大萧条，人们说：这部片子让人第一次觉得，城市也没那么安全。"],"0303":["一枚迟到十九年的奖章","1862 年，美国设立荣誉勋章。第一批获奖者中有个叫玛丽·沃克的医生，她因为救治伤员获此荣誉。可直到 1916 年，审核委员会以「她是平民」为由取消了她的勋章。六十年后，一位总统又把它补发给她——那时她已去世五十多年。"],"0304":["林肯的帽子，比人高","林肯戴一顶高筒帽，加上自己的身高，将近两米。帽子不是装饰品，是他的「移动文件柜」：信件、演讲稿、账单，全塞在帽子里。传说他在人群里不用开口，大家靠帽子就能找到他。史上最成功的「移动办公室」。"],"0305":["铁幕这个词，是他临时想的","1946 年 3 月 5 日，丘吉尔在富尔顿演讲，说出「铁幕」这个词。据他的助手回忆，丘吉尔在火车上反复念这句话，一直不满意。演讲前一夜，他改到凌晨。第二天，这个词成了冷战的代名词，也让他被很多人骂成「战争贩子」。"],"0306":["他不肯画上帝的脸","1508 年，米开朗基罗开始画西斯廷教堂天顶。教皇催他快点，他回了一句：「等画完了，自然就快了。」他仰着头画了四年，颜料滴进眼睛，脖子落下终身毛病。画里《创造亚当》中上帝与亚当的手指之间，留了一厘米的缝隙。"],"0307":["史上最赚钱的一句话","1876 年 3 月 7 日，贝尔拿到电话专利，两小时后竞争对手格雷也提交了申请。贝尔的专利被称为「史上最值钱的专利」。他打的第一通电话，对助手说：「沃森，过来一下，我需要你。」这大概是人类历史上回报率最高的一次叫人。"],"0308":["面包与玫瑰","1917 年 3 月 8 日，彼得格勒的女工走上街头，喊着「面包与和平」，这一天后来成为国际妇女节的源头之一。当时没人想到，这场游行会成为沙皇制度崩溃的第一天。妇女节的口号，最初要的是面包，不是鲜花。"],"0309":["一个不存在的国家","1454 年 3 月 9 日，意大利航海家亚美利哥出生。他后来发现，自己名字被贴上了一整片大陆，却始终没搞清那是怎样的大陆。他写过一封给朋友的信，说「我发现了新的世界」，那封信在他死后被印成小册子，卖遍欧洲。"],"0310":["孙中山的「未完成」","1925 年 3 月，孙中山病重，签下遗嘱，末尾一句「革命尚未成功，同志仍须努力」流传至今。他一生流亡、起义、失败、再起义，像打不死的小强。这份「不放弃」，比任何一页遗嘱都更值得被记住。"],"0311":["那天地壳移动了","2011 年 3 月 11 日，日本东北部发生九级地震。地球自转因此快了 1.8 微秒，日本本州岛向东移动了约 2.4 米。一位幸存的老人在避难所里说，海啸来的时候，他看见海水先是退得很远，露出海底的旧渔船，然后墙一样压了过来。"],"0312":["一棵树的节日","1915 年，中国定清明节为植树节。1925 年孙中山去世后，为了纪念他，又把他的忌日 3 月 12 日定为植树节。他生前最推崇「造林」，说过「中国欲强，须急兴农学，讲究树艺」。于是每年这一天，人们种树，也想起这个人。"],"0313":["后院里的天文学家","1781 年 3 月 13 日，赫歇尔在后院用自制望远镜发现了天王星。邻居大概以为他是个磨镜片的怪人，没人想到这个「怪人」发现了一颗行星。科普一下：业余爱好做到极致，也能改写教科书。"],"0314":["爱因斯坦的「差生」逆袭","爱因斯坦小时候说话很晚，老师断言他「不会有什么出息」。多年后他拿到诺贝尔奖，把这句话请进了历史笑话集。他说自己成功的秘诀是：「我一直保持着孩子式的好奇。」老师的话，有时候真不能全信。"],"0315":["「三月十五日」为什么成了禁忌","公元前 44 年 3 月 15 日，凯撒在元老院被刺杀。传说他看见人群里有自己的好友布鲁图斯，说了一句「你也有份吗，我的孩子」，然后放弃了抵抗。此后罗马人一提到「三月十五日」就变色，这个日子成了一个不祥的代名词。"],"0316":["一颗土豆地里的小火箭","1926 年 3 月 16 日，戈达德在婶婶的菜地里发射了世界第一枚液体燃料火箭——飞了 2.5 秒，落在 12 米外的白菜地里。《纽约时报》第二天嘲讽他不懂物理。四十九年后，报纸登更正道歉。菜地里长出了航天时代。"],"0317":["意大利的统一，少不了一个人","1861 年 3 月 17 日，意大利王国宣告成立。加富尔、加里波第、马志尼三个人被称作「统一三杰」，但真正把国家拼起来的是加富尔的谈判桌。有人说：加里波第用剑打下的地方，加富尔用地图换了回来。"],"0318":["七十二天","1871 年 3 月 18 日，巴黎人民起义，成立巴黎公社。公社只存在了七十二天。它做的第一件事是免除房租，第二件是让工人接管工厂。最后一周，街垒战打到拉雪兹神父公墓，一百多名社员在墙下被枪杀，那堵墙后来叫「公社社员墙」。"],"0319":["崖山那天的风","1279 年 3 月 19 日，崖山海战，宋军大败。陆秀夫背着八岁的小皇帝投海，十万军民随之赴海。文天祥被押在元军船上，亲眼看着这一幕，写下「人生自古谁无死」。据说那天海上起了风，尸体浮起来，遮住了整片水面。"],"0320":["世界上第一家股份公司","1602 年 3 月 20 日，荷兰东印度公司成立。它发了世界上第一支股票，也建了第一个证券交易所。有意思的是，公司成立时，荷兰人并不知道香料群岛在哪里，只知道那里有香料——他们先卖了「未来」。"],"0321":["巴赫抄谱抄到深夜","1685 年 3 月 21 日，巴赫出生。他九岁丧母，十岁丧父，跟着哥哥生活。哥哥不让他看一本乐谱，他就趁夜里偷偷抄，抄了六个月，被发现了，谱子被没收。他说：「我想知道那些音是怎么写出来的。」"],"0322":["电影的第一批观众吓跑了","1895 年 12 月，卢米埃尔兄弟放了一部叫《火车进站》的短片。据说观众看见火车从屏幕里冲过来，吓得往后退。这个故事很可能是后人编的。但那一年，他们确实让人类第一次看见「会动的照片」。"],"0323":["同一天生日的两位巨人","世界气象日定在 3 月 23 日，纪念 1950 年《世界气象组织公约》生效。而 1749 年这一天，法国数学家拉普拉斯出生。他写过一句话：「给定初始条件，宇宙的过去与未来都可以算出来。」两百年后，混沌理论证明他错了——天气就是最好的反例。"],"0324":["他死在自己的定理里","1882 年 3 月 24 日，科赫宣布发现结核杆菌。为了证明这种菌是病因，他做了几百次实验，最后用豚鼠完成了「科赫法则」。他要证明一件事：一种病，只能由一种菌引起。这个法则至今仍是传染病学的第一课。"],"0325":["一封信和一位「差评师」","1655 年 3 月，惠更斯用自制望远镜发现了土星最大的卫星泰坦。当时很多人不信，说他看错了。惠更斯没吵架，只回了一句：「欢迎自己磨镜片来看。」天文学史上最早的「不服自己看」，从此成为传统。"],"0326":["他写完了第九交响曲","1824 年 5 月 7 日，《第九交响曲》首演。贝多芬已经全聋，背对观众指挥。演出结束，女低音把他转过身来，他才看见全场起立鼓掌——他听不见，只看见一片手在挥动。那一刻，他哭了。"],"0327":["两架飞机的相遇","1977 年 3 月 27 日，特内里费岛机场，两架波音 747 在跑道上相撞，五百八十三人遇难。起因是一场大雾、一句含糊的指令，和一位机长以为「可以起飞」的误判。航空史从此规定：任何含糊的指令都必须复述确认。"],"0328":["他翻译了「物竞天择」","严复翻译《天演论》时，把赫胥黎的「natural selection」译成「天择」，再加上「物竞」二字。这本书 1898 年出版，正赶上甲午战败，读书人争相传抄。胡适说，他那一代人，没有人没读过《天演论》。"],"0329":["一口井里的军队","1974 年 3 月 29 日，陕西临潼的农民在打井，挖到几块陶片。有人说是「瓦爷」，有人说是「神像」。县文化馆的人赶来，看见一片陶俑的手臂。后来挖出了八千个兵马俑，每一个的脸都不一样。"],"0330":["梵高：生前一幅，身后亿幅","梵高一生只卖出一幅《红色葡萄园》，还靠弟弟接济过日子。他去世后，画作拍卖价格一路飙升，最高一幅上亿。他生前大概想都不敢想：自己随手画的向日葵，如今被印在全世界的马克杯上。艺术家的命运，就是这么爱开玩笑。"],"0331":["铁塔差点被拆掉","1889 年 3 月 31 日，埃菲尔铁塔落成。巴黎的作家和艺术家联名抗议，说它是「一根插进巴黎心脏的铁钉子」。铁塔本是临时建筑，原计划二十年后拆除。因为可以架设天线，它被留了下来，如今成了巴黎的象征。"],"0401":["BBC 的「面条树」","1957 年 4 月 1 日，BBC 播出「瑞士农民从树上收割意大利面」的新闻，观众打电话问怎么种。BBC 一本正经回复：「把一根面条插进番茄酱里，等着就行。」史上最成功的愚人节玩笑，把「一本正经地胡说八道」发挥到了极致。"],"0402":["安徒生的求职史","安徒生十四岁揣着几个铜板去哥本哈根，想当演员，失败；想当歌唱家，也失败。后来他写童话，写着写着成了丹麦的国宝。他的经历告诉我们：面试被拒一百次没关系，写点别的，说不定就流芳百世了。"],"0403":["第一通手机电话打给了谁","1973 年 4 月 3 日，摩托罗拉的库珀在纽约街头掏出「砖头」一样的手机，拨给了竞争对手贝尔实验室。他说：「我在用一部真正的手机给你打电话。」对方沉默了很久。十年后，手机才正式上市。"],"0404":["他死在旅馆的阳台上","1968 年 4 月 4 日，马丁·路德·金在孟菲斯被枪杀。前一天晚上，他做过一场演讲，说「我已经看见了应许之地，我可能到不了，但你们会到。」第二天傍晚，他站在汽车旅馆二楼的阳台上，子弹从斜对面射来。"],"0405":["一位首相辞职后的日子","1955 年 4 月 5 日，丘吉尔辞去首相职务。他晚年常坐在花园里，对着池塘看鱼。有人问他是否怀念权力，他说：「我怀念的不是权力，是有事情可做。」他活到九十岁，最后十年几乎没再发表过任何政治言论。"],"0406":["第一届奥运会的「奇怪奖品」","1896 年第一届现代奥运会，冠军得到的是银牌、橄榄枝和证书，没有金牌。希腊牧羊人路易斯赢了马拉松，有人送他一套理发工具，他谢绝了，只想要一匹马。史上最朴素的奥运冠军，奖品清单还没有今天的学生奖品丰盛。"],"0407":["拜占庭的「希腊火」","公元 678 年，阿拉伯舰队围攻君士坦丁堡，被一种能在水上燃烧的「希腊火」击退。配方是国家最高机密，据说只有皇帝和一位工匠知道。这套秘方保存了几百年，至今没人复原出确切配方。"],"0408":["佛陀诞生的那棵树","传说公元前 563 年的这一天，释迦牟尼诞生在蓝毗尼园的一棵无忧树下。他母亲摩耶夫人在回娘家途中，手扶树枝生下了他。他出生七天，母亲就去世了。后来他成道，第一件事是为母亲说法。"],"0409":["一支烟和一场投降","1865 年 4 月 9 日，李将军向格兰特投降。格兰特穿着脏兮兮的旧外套，李将军穿着崭新的军装。签字后格兰特请对方抽烟，两人聊起墨西哥战争往事，像老同学叙旧。史上最体面的投降，输赢之外还有点人情味。"],"0410":["「女士和孩子优先」","1912 年 4 月 15 日，泰坦尼克号沉没。船上有一位名叫伊达·斯特劳斯的富商太太，她已经上了救生艇，却跳回甲板，说「我陪我的丈夫」。有人回忆，最后见到他们时，两人坐在甲板的椅子上，手挽着手，等水漫上来。"],"0411":["「休斯顿，我们遇到麻烦了」","1970 年 4 月 13 日，阿波罗十三号的氧气罐爆炸。三位宇航员绕到月球背面，用登月舱当救生艇。地面工程师用一个塑料袋和几块纸板，做出了能过滤二氧化碳的装置，念给宇航员照做。四天后，三个人活着回来了。"],"0412":["人类第一次上天，紧张到说啥都行","1961 年 4 月 12 日，加加林上天前说了句「走吧！」（Поехали!）。108 分钟后落地，他成了全球英雄。后来有人问他怕不怕，他说：「怕，但我相信那颗球。」宇航员的第一次，紧张程度和第一次上台演讲差不多——只是下不来。"],"0413":["杰斐逊的一天","1743 年 4 月 13 日，杰斐逊出生。他一生写过一万多封信，读过六千多本书，临终前把自己的藏书卖给国家，成了国会图书馆的基础。他的墓碑上写着自己最骄傲的三件事：起草《独立宣言》、起草宗教自由法案、创建弗吉尼亚大学。"],"0414":["头等舱与三等舱","泰坦尼克号沉没时，头等舱男性的生还率约三成，三等舱儿童的生还率不到三成。船上的乐队一直演奏到最后一刻，据说最后一只曲子是《与我更近我主》。乐队八人无一生还，他们的名字刻在南安普敦的纪念碑上。"],"0415":["达·芬奇的「反向日记」","达·芬奇留下一万多页笔记，全是镜像文字，要从右往左读。为什么这么写？他是左撇子，正着写会蹭花墨迹。也就是说，改变世界的天才笔记，起因只是懒得等墨水干。天才的很多习惯，其实都是「怕麻烦」。"],"0416":["卓别林的第一次「演出费」","五岁的卓别林替失声的母亲上台救场，观众往台上扔硬币。他唱完歌先去捡钱，再鞠躬，说「这是我一生中最难忘的掌声」。多年后他成了喜剧大师，靠的还是这个思路：先让人笑，再谈艺术。"],"0417":["四月的十七天","1975 年 4 月 17 日，红色高棉进入金边。他们先说要「疏散城市三天」，然后就把全城人赶向农村，三天变成了三年多。学校、医院、货币被废除。有一位幸存者说：「他们让我们忘掉时间，只记得年。」"],"0418":["地震后的四十八秒","1906 年 4 月 18 日，旧金山大地震。地震只持续了四十多秒，随后的大火烧了三天。消防队因为水管破裂，只能眼睁睁看着城市烧成灰。事后重建时，人们发现建在填海区的房子塌得最厉害——那是城市第一次学会看地质。"],"0419":["一支箭和一声枪响","1775 年 4 月 19 日，列克星敦的草地上响起枪声。有人说第一枪是英军打的，有人说是民兵打的，至今没有定论。诗人爱默生写了一首诗，把这一枪称作「震撼世界的一枪」。可那天早上，实际只有八个人死亡。"],"0420":["一颗子弹与两首诗","1999 年 4 月 20 日，科伦拜恩中学枪击案。两名学生射杀了十三人后自杀。事后人们发现，他们留下了大量视频和日记。枪手的母亲后来写了一本书，反复问一个问题：「我们做错了什么？」这个问题，至今没有答案。"],"0421":["在她二十一岁生日那天","1926 年 4 月 21 日，伊丽莎白出生。她十岁时，伯父退位，父亲登基，她成了继承人。二战期间，她坚持加入女子辅助服务队，学开卡车、修引擎。她说：「我们这一代，必须做点实际的事。」这个习惯，她保持了一辈子。"],"0422":["地球日为什么是 4 月 22 日","1970 年 4 月 22 日，两千万美国人走上街头，参加第一个地球日。选这一天是为了吸引大学生，因为它落在春假和期末考试之间。组织者说：「我们要的不是演讲，是行动。」这一年，美国通过了《清洁空气法》。"],"0423":["两个大文豪的「分手日」","1616 年 4 月 23 日，莎士比亚和塞万提斯去世。虽然英国当时用旧历，两人其实不是严格意义上的同一天走的，但文学史决定把这算成巧合。1995 年，联合国干脆把这天定为世界读书日——纪念「世界失去了两支笔」。"],"0424":["「东方红一号」这颗卫星","1970 年 4 月 24 日，中国第一颗人造卫星升空。它重 173 公斤，比苏美第一颗卫星加起来还重。它在太空播放《东方红》乐曲，地面的收音机就能收到。设计寿命 20 天，实际工作了 28 天。人们叫它「会唱歌的星星」。"],"0425":["一页论文引发的革命","1953 年 4 月 25 日，沃森和克里克在《自然》发表 DNA 双螺旋论文，全文不到一页。现在的研究生发一篇论文动辄几十页、几百条参考文献。史上含金量最高的一页纸，直接改写了生物学。"],"0426":["那晚的蓝色光柱","1986 年 4 月 26 日，切尔诺贝利四号反应堆爆炸。附近居民被叫到桥上观看，说「那是美丽的蓝光」。很多人后来死于辐射。消防员没穿防护服就冲进去灭火，有人回忆：「我们以为只是一场普通火灾。」"],"0427":["他死在一座小岛上","1521 年 4 月 27 日，麦哲伦在菲律宾与当地人冲突中被杀。他率五艘船出发，只剩一艘回国。出发时 270 人，回来 18 人。他没能完成环球航行，但那条航线以他的名字被记住。"],"0428":["一位校长的葬礼","1940 年 3 月，蔡元培在香港病逝。他一生做了两件大事：一是办北大，二是建立中央研究院。他当北大校长时，让陈独秀、胡适、李大钊同时任教，学生说「什么主义都能在校门口听见」。他去世时，全城送来挽联。"],"0429":["被倒挂在广场上的那个人","1945 年 4 月 29 日，墨索里尼的尸体被倒挂在米兰的加油站顶上示众。前一天，他和情妇在逃亡途中被游击队处决。有个老太太朝尸体开了三枪，说：「我为我的五个儿子开的。」战争结束了，可恨意还在。"],"0430":["华盛顿的「首日通勤」","1789 年 4 月 30 日，华盛顿宣誓就任美国总统。就职演说只有两页，念完就走了，没握手没合影。他在日记里写：「今天我成为了总统。」史上最低调的就职典礼，大概连朋友圈都没发一条。"],"0501":["八小时工作制的「生日」","1886 年 5 月 1 日，芝加哥工人大罢工，口号是「八小时工作、八小时休息、八小时归自己」。一百多年过去，这个口号在全世界基本实现了——除了偶尔加班的时候。五一劳动节，记得对自己好一点。"],"0502":["达·芬奇最后的住所","1519 年 5 月 2 日，达·芬奇在法国昂布瓦兹去世，享年 67 岁。他晚年左手瘫痪，仍坚持画素描。据传他死在国王弗朗索瓦一世的怀里。他留下的遗嘱很简单：把存款分给仆人和穷人。"],"0503":["一部宪法的代价","1791 年 5 月 3 日，波兰颁布欧洲第一部现代成文宪法。它比法国宪法还早四个月，却只实行了一年多。1795 年，波兰被俄、普、奥三国三次瓜分，从地图上消失了 123 年。宪法保存在一座教堂里，直到一战结束。"],"0504":["那天下午，街上发生了什么","1919 年 5 月 4 日下午，北京三千多名学生从北大出发，走向东交民巷。他们原想递交请愿书，被军警拦住。有人喊了一声「去赵家楼」，队伍便转向。后来的事被写进教科书，可当天很多学生只是想喊几句话。"],"0505":["马克思的「穷讲究」","马克思一生穷到大衣当了买纸，却坚持在大英博物馆坐固定的位子看书，磨出了脚印。他给人类的贡献是一本巨著，给人类留下的启示还有一条：再穷，也要有自己的「专属座位」。"],"0506":["三十四秒和一架飞艇","1937 年 5 月 6 日，兴登堡号飞艇在新泽西上空起火，三十四秒内烧毁。无线电记者赫伯特·莫里森当场直播，喊出「哦，人性啊」，这段录音成了广播史上最著名的声音之一。飞艇时代随之结束。"],"0507":["贝多芬的「翻车」现场","1824 年 5 月 7 日，《第九交响曲》首演。贝多芬全聋了，背对观众「指挥」，演出结束都不知道全场起立鼓掌，直到女歌手把他转过来。他看见挥动的手帕，哭了。史上最催泪的「翻车」：听不见掌声，但看得见。"],"0508":["一条街上的两个名字","1945 年 5 月 8 日，伦敦街头成千上万的人涌向白金汉宫。丘吉尔站在阳台向人群挥手。同一天，德国无条件投降书生效。不过，苏联把胜利日定在 5 月 9 日，因为签字时莫斯科已经是第二天凌晨。"],"0509":["一位外交部长的小建议","1950 年 5 月 9 日，法国外长舒曼提出一个建议：把法德的煤钢生产放在一个共同机构下管理。他说：「我们的目的不是造武器，而是让战争变得不可能。」这句话后来被刻在布鲁塞尔欧盟总部的大厅里。"],"0510":["打桩的那一天","1869 年 5 月 10 日，美国第一条横贯大陆铁路合龙。最后一根道钉是金的，用铁锤敲时，大西洋一端和太平洋一端的人都听见了电报传来的锤击声。大量华工参与了这条铁路的修建，很多人没留下姓名。"],"0511":["机器人一词的「乌龙」","1920 年，捷克作家恰佩克发明了「Robot」这个词，捷克语原意是「劳役」。他弟弟建议用这个词，他后来有点后悔，说原本想叫「劳动者」但太难听。结果一个随手起的名字，定义了整个机器人时代。"],"0512":["那一夜，他们徒步进了城","2008 年 5 月 12 日，汶川地震。第二天凌晨，一批解放军在泥石流拦路的山路上徒步机动，翻山越岭进入灾区。有一位战士在废墟下被埋了几十小时，出来后的第一句话是「我要再上去救一个」。"],"0513":["一场不寻常的演讲","1940 年 5 月 13 日，丘吉尔第一次以首相身份在下院演讲。他说：「我所能奉献的，只有热血、辛劳、眼泪和汗水。」演讲只有几分钟，下院却有掌声和眼泪。有人说，那一刻，英国已经知道自己在打一场怎样的战争。"],"0514":["疫苗的「牛」来历","1796 年 5 月 14 日，詹纳给一个八岁男孩接种牛痘，孩子没得天花，疫苗诞生了。「疫苗」的英文 vaccine，词根是拉丁语「牛」——史上第一次，人类要感谢一头牛。挤奶女工手上的一个小痘，救了几亿人。"],"0515":["麦当劳的「15 秒哲学」","1940 年，麦当劳兄弟在加州开了第一家餐厅，把菜单从 25 样砍到 9 样，汉堡 15 秒出餐。有人问为什么这么极端，他们回答：「快，比好吃更重要。」一位顾客尝了汉堡说：「这是什么？」答案是：快餐时代的开端。"],"0516":["第一届奥斯卡，第一个影后","1929 年 5 月 16 日，第一届奥斯卡颁奖只用了十五分钟，没有红毯，也没有电视直播。最佳影片是《翼》，第一届影后是二十二岁的珍妮·盖诺。她事先并不知情，是被朋友叫醒后才赶去领奖的。奖品是一尊十英寸高的铜像，底座镀金。"],"0517":["一个护士的两个决定","1873 年，南丁格尔写下《医院札记》。她当护士时，坚持每天用尺子量病床之间的距离，认为通风比吃药重要。她用统计图表画出了「可预防死亡」的数据。英国女王看了，把她的图表拿给内阁大臣传阅。"],"0518":["火山口最老的摄影师","1980 年 5 月 18 日，圣海伦斯火山爆发，山顶被削去了 400 米。一位摄影记者在火山口附近住了一个多月，拍到了爆发前最后几天的照片。他的遗作洗出来后，人们发现照片上的他对着镜头笑着。"],"0519":["他的胡须","胡志明一辈子留着一撮山羊胡，穿一件旧中山装，住在一座高脚木屋里。他当国家主席时，越南正在打仗。有人问他要不要搬到豪华官邸，他说：「我住这里，可以听见鸟叫。」他临终时，床边放着一本诗集。"],"0520":["林白的「33 小时」","1927 年 5 月 20 日，林白独自飞越大西洋，33 小时不敢合眼。为了保持清醒，他在手上划口子、开窗吹冷风。落地巴黎时，十万人在等他，他开口第一句是：「牛奶在哪里？」英雄落地，先要一杯奶。"],"0521":["小满这一天","农谚说「小满不满，芒种不管」。小满的意思是麦粒开始饱满，但还没成熟。江南一带又有「小满动三车」的说法——水车、油车、丝车同时转起来。这一天，农人最怕的是雨，麦子一淋雨就要发芽。"],"0522":["柯南·道尔的最后一封信","1930 年，柯南·道尔去世。他晚年沉迷「通灵术」，到处演讲，说自己能和死者对话。他的朋友很不理解。他去世前留了一封信，封好交给妻子，说：「总有一天会有人来证明它。」那封信至今没打开。"],"0523":["林奈给万物起名","1753 年，林奈发表《植物种志》，定下「双名法」：每种生物用两个词命名，一个属，一个种。他给自己的名字是「林奈，瑞典人」。他死后，标本被卖到英国，瑞典政府追悔莫及，此后禁止出售任何林奈藏品。"],"0524":["一封电报的两个时间","1844 年 5 月 24 日，莫尔斯从华盛顿发出第一封电报，内容是「上帝创造了何等奇迹」。四十年后，他的女儿在同一个房间收到了来自世界各地的电报。她回电说：「这是一个奇迹。」"],"0525":["肯尼迪的「自我加压」","1961 年 5 月 25 日，肯尼迪宣布十年内载人登月。NASA 说做不到提前，他便定了 1969 年，还追加了 200 多亿美元。NASA 从此进入「不加班不行」模式。史上最贵的 deadline，逼出了一个登月。"],"0526":["窑洞里的那些天","1938 年 5 月，毛泽东在延安窑洞里写《论持久战》，一连写了好几天，脚边的炭火烧着了棉鞋，他都没察觉。稿子写完，他在会上讲了几天。有人说这本书预言了抗战的走向，他说：「这不是预言，是算出来的。」"],"0527":["一个建在沼泽上的城","1703 年 5 月 27 日，彼得大帝下令建圣彼得堡。那地方是涅瓦河口的沼泽，常年洪水。他说：「一座城市要面向欧洲，就得建在海边。」此后二十年，数万农奴死在工地上。这座城起在骨头之上。"],"0528":["一座桥的落成","1937 年 5 月 28 日，金门大桥通车。桥上挤满二十万人，有人的鞋被踩掉。设计者施特劳斯说，这座桥要经得住「最大的风、最重的地震」。为了防雾，桥身刷了国际橙，本是想让船只看得清楚，结果成了它的标志色。"],"0529":["珠峰上的「谦让」","1953 年 5 月 29 日，希拉里和丹增登顶珠峰。两人在峰顶待了十五分钟，互相都不肯说谁先踏上顶峰。丹增说「我在前面」，希拉里说「我们同时的」。登山史上最高海拔的绅士风度，发生在离天最近的地方。"],"0530":["她十九岁，被绑在火刑柱上","1431 年 5 月 30 日，贞德在鲁昂被烧死。审判她的教士问：「你凭什么说上帝跟你说话？」她回答：「我凭我的信心。」行刑时，她要求看十字架，有人说她吻着十字架，在火中念了六遍耶稣的名字。"],"0531":["他给自己写讣告","惠特曼在《草叶集》第一版里夹了一封匿名评论，说这本书「是美国人写的最好的诗」。评论其实是他自己写的。他说：「我得先让自己出名，人们才会读我。」六十年后，人们把他的铜像立在纽约的桥头。"],"0601":["惠特曼的「自夸」","1855 年，惠特曼的《草叶集》出版，没人捧场，他匿名写书评夸自己「这是美国人写的最好的诗」。后来有人发现书评作者就是他本人，但他不在乎：「我得先让自己出名，人们才会读我。」史上最早的「自评五颗星」。"],"0602":["加冕那天的雨","1953 年 6 月 2 日，伊丽莎白二世加冕，伦敦下着雨。仪式持续三个小时，她戴着七公斤的王冠，端坐不动。她后来承认：「那顶王冠太重了，我不能低头。」这句话被许多人记住，像是对一个女王一生的注解。"],"0603":["虎门的海水","1839 年 6 月 3 日，林则徐在虎门海滩销烟，用了二十三天，把两万多箱鸦片倒进石灰池。有洋商记录，说看着鸦片被海水冲走，心疼得掉泪。林则徐回了一句：「你们的眼泪，该为那些抽鸦片的人流。」"],"0604":["那天，罗马开城","1944 年 6 月 4 日，盟军进入罗马。希特勒曾下令炸毁罗马的桥梁，德军指挥官凯塞林拒绝执行，说：「这是座两千年的城。」于是罗马几乎完好地交了出去。战争之后，这座城市仍保持着它原来的样子。"],"0605":["一个计划的名字","1947 年 6 月 5 日，马歇尔在哈佛演讲，只有十二分钟。他没提「援助」，也没提「欧洲」，只是说美国愿意帮欧洲重建。记者问他计划叫什么，他说：「别用我的名字。」第二天，报纸头版都是「马歇尔计划」。"],"0606":["诺曼底的「备用稿」","1944 年 6 月 6 日诺曼底登陆前，艾森豪威尔在口袋里揣着一份「失败声明」：登陆失败，责任在我。幸运的是这份声明没用上，被他锁进了抽屉。史上最体面的 B 计划：赢了不揽功，输了先认账。"],"0607":["高更与梵高的两只耳朵","1888 年 12 月，高更和梵高在阿尔勒同住，吵架后高更离开。当晚梵高割下自己的一只耳朵，送给一个妓女。高更后来在日记里说：「我记得他那时的样子，一句话也不说。」此后两人再没见过面。"],"0608":["《一九八四》的结尾","1949 年 6 月 8 日，奥威尔的《一九八四》出版。他写这本书时，已经病重，靠口述完成。书的结尾是：「他爱老大哥。」有人问他为什么写得这样绝望，他说：「我不是预言，我只是把已经出现的东西，往前推了一步。」"],"0609":["尼禄的「艺术家自白」","公元 68 年，罗马皇帝尼禄被逼自杀，临死前叹了一句：「一个艺术家要死了。」——他是皇帝，但他一直觉得自己是被皇位耽误的艺术家。史上最离谱的辞职理由，出自一个帝国的老板。"],"0610":["一场比赛的起点","1829 年 6 月 10 日，牛津和剑桥在泰晤士河上举行第一场赛艇对抗赛。比赛结束后，两校约定：每年一次，输的一方要请客。这场传统延续了近两百年，只有两次世界大战期间中断过。"],"0611":["一百零三天","1898 年 6 月 11 日，光绪帝颁布「明定国是」诏书，戊戌变法开始。变法持续了一百零三天。康有为走进总理衙门的那天，有人看见他穿一身蓝布长衫，站在门口等了很久。变法失败后，他流亡海外十六年。"],"0612":["安妮的生日礼物","1942 年 6 月 12 日，安妮·弗兰克十三岁生日，收到一本红格子日记本。她在第一页写：「我希望你能完全信任我，像从没信任过任何人一样。」后来这本日记成了世界上被读得最多的「树洞」。"],"0613":["飞出太阳系的那艘船","1983 年 6 月 13 日，先驱者十号越过海王星轨道。它带着一张金唱片，上面刻着人类的位置、一些图形和问候。四十年过去，它仍在飞，距地球两百多亿公里。人类已和它失去联系，它继续向着某颗星。"],"0614":["一个阿根廷人骑摩托出发","1952 年，二十四岁的格瓦拉和朋友骑一辆破摩托，从阿根廷出发穿越南美。路上车坏了，他们搭便车、睡工棚、在医院做义工。他在日记里写：「我看见了另一种人。」那八个月，改变了他的一生。"],"0615":["大宪章的签署","1215 年 6 月 15 日，英王约翰在兰尼米德草地签署《大宪章》。他并不情愿，签完就把文件扔到一边，请教皇宣布它无效。但这份文件被抄了很多份，藏进教堂。其中一份，八百年后还在大英图书馆的玻璃柜里。"],"0616":["第一位女航天员的「落地式惊讶」","1963 年 6 月 16 日，捷列什科娃成为首位进入太空的女性，降落在西伯利亚。当地农妇看见穿橙色宇航服的她，问：「你是从月亮上来的吗？」她回答：「不，我是从莫斯科来的。」史上最硬核的「出差回来」。"],"0617":["自由女神的「骨架」","1885 年 6 月 17 日，自由女神像运抵纽约港。它是分装在 214 个大木箱里运来的，像一具拆开的骨架。组装时，工程师在内部搭了一座铁塔——设计者正是埃菲尔。铜皮只有 2.4 毫米厚，比硬币还薄。"],"0618":["滑铁卢的雨","1815 年 6 月 18 日，滑铁卢战役前一晚下了一整夜暴雨。拿破仑的炮兵无法按时进入阵地，进攻被迫推迟。他后来在圣赫勒拿岛回忆：「如果那天下雨晚一点，历史会不一样。」这场雨，成了无数历史书的转折点。"],"0619":["他活到三十九岁","帕斯卡三十九岁去世，一生只写过两本完整的书。他发明了第一台机械计算机，做出了气压实验，还写下《思想录》。他死后，仆人在他衣服的衬里里发现一张纸，上面写着「火」和一个日期——那是他说的「皈依之夜」。"],"0620":["六年，和一只箱子","1837 年 6 月 20 日，维多利亚即位，那年她十八岁。她登基后的第一件事，是让人把寝室里母亲的东西搬出去。她后来回忆：「我终于可以一个人睡了。」她在位 63 年，英国在此期间成了世界工厂。"],"0621":["夏至的卦","古人把夏至视为「阳气至极、阴气始生」的一天。《礼记》载，夏至日要祭祀地神，因为「地属阴」。这一天北半球白昼最长，北京约 15 小时；越往北越长，漠河几乎不夜。过了这天，白天就开始变短了。"],"0622":["跪下的科学家","1633 年 6 月 22 日，伽利略在宗教裁判所宣读悔过书，宣布放弃「地球会动」的看法。据说他起身时低声说了句「可它仍在转」。他被判终身软禁，最后九年住在佛罗伦萨郊外的别墅里，继续写书。"],"0623":["图灵的「苹果」","图灵破解了德国密码，帮二战提前结束两年，却因同性恋被判化学阉割。1954 年他咬下一口浸过氰化物的苹果。有人说苹果公司的 logo 是向他致敬——被咬掉一口的苹果，成了一个时代的隐喻。"],"0624":["一颗糖和一座城","1948 年 6 月 24 日，苏联封锁西柏林。美军启动了空运，一年间飞了近 28 万架次。飞行员哈维在降落前，用手帕做成小降落伞，给孩子们空投糖果。柏林的孩子叫他「摇翅膀的叔叔」。"],"0625":["那天，他被从梦中叫醒","1950 年 6 月 25 日，朝鲜战争爆发。有回忆说，战争开始时，北朝鲜的军队以为自己只是在进行一次「演习」，很多人直到越过边界才知道这是战争。三年后，停战协定在板门店签字，两国至今仍处于停战状态。"],"0626":["六周写成的宪章","1945 年 6 月 26 日，五十个国家的代表在旧金山签署《联合国宪章》。会议开了两个月，宪章只有一半篇幅是新的，另一半沿用了国际联盟的旧条文。签字时，中国代表第一个走上台，用的是毛笔。"],"0627":["她十九个月时失去了全部感官","1880 年 6 月 27 日，海伦·凯勒出生。一岁半时一场病夺走了她的听觉和视觉，世界从此又黑又静。七岁那年，沙利文老师来到她家，在她手心写字。当「水」这个词被写在她手上，她后来回忆：「我忽然明白了，万物都有名字。」"],"0628":["一颗子弹，和一场大战","1914 年 6 月 28 日，斐迪南大公夫妇在萨拉热窝遇刺。刺客是一群年轻的塞尔维亚民族主义者，其中一个叫普林齐普，十九岁。他开枪后服毒，却因呕吐被抓住。一个月后，欧洲各国相继宣战。"],"0629":["第一台苹果手机","2007 年 6 月 29 日，第一代 iPhone 开卖。有人提前几天在店门口排队。发布会上，乔布斯说：「今天，苹果要重新发明电话。」他演示时，第一台手机因为信号太多而卡住了，他只好换了一台继续讲。"],"0630":["爆炸那天的森林","1908 年 6 月 30 日，通古斯上空发生大爆炸，两千平方公里的森林被夷平。因为没有陨石坑，科学家争论了一百年。有人说那是彗星，有人说是小行星，还有人说那是「反物质」。直到今天，还没有定论。"],"0701":["那一天的上海","1921 年 7 月，十几个人在上海法租界一栋石库门里开会，后因巡捕搜查，转移到嘉兴南湖的一条游船上。会议开了七天，最后一天在船上，有人提议打麻将做掩护。他们当时平均年龄二十八岁。"],"0702":["海明威的最后一年","1961 年 7 月 2 日，海明威在爱达荷州的家中开枪自杀。他晚年抑郁，无法写作。他父亲也是同样的方式离世。他的墓碑上写着：「欧内斯特·米勒·海明威，1899—1961。」没有墓志铭，没有引言。"],"0703":["卡夫卡要求烧掉的作品","1924 年，卡夫卡去世。他留下遗嘱，要求朋友布罗德烧掉自己所有未发表的手稿。布罗德没烧，反而全部整理出版，包括《城堡》《审判》。卡夫卡若知道，大概会更不安——他最不愿见人的，恰恰成了他的名声。"],"0704":["《独立宣言》的「返工史」","1776 年 7 月 4 日，大陆会议通过《独立宣言》。杰斐逊写完初稿，富兰克林和亚当斯改了一百多处，删掉了他最得意的段落。杰斐逊气得半死。两百年后，历史记住的是「作者杰斐逊」——改稿的痛苦，果然是白受的。"],"0705":["牛顿的苹果树","传说牛顿被苹果砸中，发现了万有引力。真相是：他确实看见苹果落地，但没砸到头上——那棵树要真砸中过人，牛顿的论文大概得改成《论头疼与引力》。苹果没砸到他，思想砸中了他。"],"0706":["被狗咬的孩子","1885 年 7 月 6 日，巴斯德给一个被疯狗咬伤九岁的男孩注射疫苗。男孩的母亲从阿尔萨斯赶来，跪着求他。巴斯德当时并不确定有效，他说：「我冒的险，是要用我自己的名誉去赌。」男孩活了下来。"],"0707":["那一夜的枪声","1937 年 7 月 7 日，卢沟桥事变。当晚日军在城外演习，称一名士兵失踪，要求进城搜查。守军拒绝，双方交火。第二天，日军发起进攻。此后八年，中国进入全面抗战，一座石桥成了民族记忆的起点。"],"0708":["一首诗的结尾","1822 年 7 月 8 日，雪莱溺死于意大利外海，年仅二十九岁。他出海前，把一本诗集放在口袋里。八天后，人们在海滩上发现他的尸体，书还在。火化时，朋友拜伦跳进海里游向火堆，说：「我要向这具骨头告别。」"],"0709":["独立日的前一夜","1816 年 7 月 9 日，阿根廷宣布独立。图库曼的会议厅很小，代表们争论了很久。宣布独立那天，有人问用什么形式，大家说：「就用人民的声音。」随后，广场上的人们被叫来，一起喊了三遍「独立」。"],"0710":["特斯拉的「作息表」","特斯拉每天睡两个小时，说能在脑子里「运转」一台机器。他发明交流电，晚年却在旅馆喂鸽子。有人问他成功秘诀，他说：「独处是发明的秘方。」史上最强「独居博主」，天赋点全点在了电上。"],"0711":["船队的第一次远航","1405 年 7 月 11 日，郑和率两百余艘船从刘家港出发。船队有两万七千多人，最大的宝船长四十四丈。第一次远航到爪哇、苏门答腊、锡兰，带回长颈鹿。人们说那是「麒麟」。"],"0712":["滚石的「首次翻车」","1962 年 7 月 12 日，滚石乐队第一次演出，台下几十个人，一首歌都没完整弹完。主唱贾格尔后来回忆：「当时想，完了。」二十年后他们成了「世界上最伟大的摇滚乐队」。所有的传奇，首演都不太行。"],"0713":["第一届世界杯的球","1930 年 7 月 13 日，第一届世界杯在乌拉圭开幕。十三个国家参赛，欧洲只有四国愿意远渡大西洋。决赛那天，乌拉圭 4:2 胜阿根廷，全国放假一天。奖杯是纯金的，后来被盗过两次，最后被熔掉了。"],"0714":["巴士底狱里只有七个人","1789 年 7 月 14 日，巴黎人攻占巴士底狱。这座著名的监狱里当时只关着七名囚犯：四个造假者、两个精神病人和一个贵族。但当人群冲进去，他们找到的是一种象征。这一天成了法国国庆日。"],"0715":["一块石头上的三种文字","1799 年 7 月 15 日，法军在埃及罗塞塔发现一块石碑，上面刻着同一段话的三种文字：古埃及象形文、世俗体、希腊文。二十三年后，商博良靠它破解了象形文字。埃及学，从一块石头开始。"],"0716":["「我现在成了死神」","1945 年 7 月 16 日，第一颗原子弹试爆成功。奥本海默看着火球，想起《薄伽梵歌》的一句：「我成了死神，世界的毁灭者。」他说完这句话，转身继续签下一份实验报告。科学家的浪漫和沉重，常常在同一秒。"],"0717":["迪士尼的「黑色星期日」","1955 年 7 月 17 日，加州迪士尼乐园开园，涌进两万八千人——请柬只有一万一千张，其余全是蹭票的。水管罢工、高跟鞋被柏油粘住，史上最狼狈的开业。后来员工管它叫「黑色星期日」，游客管它叫「值得」。"],"0718":["他坐牢二十七年","1918 年 7 月 18 日，曼德拉出生。他因反对种族隔离被判终身监禁，在罗本岛坐牢十八年，每天在石灰石采石场劳动，视力因此受损。他在狱中偷偷写下自传草稿，埋在院子里的花坛下。"],"0719":["投票之前，她们被关了起来","1848 年 7 月 19 日，美国第一届女权大会在塞内卡福尔斯召开。大会宣言以《独立宣言》为模板，说「所有男女都是平等的」。当时报纸嘲笑她们，说这些女士「大概连晚饭都做不好」。七十年后，美国女性获得了投票权。"],"0720":["登月的「15 秒倒计时」","1969 年 7 月 20 日，登月舱降落月球时，燃料只剩 15 秒的量。休斯顿的工程师捏着汗说「继续」，阿姆斯特朗手动驾驶躲过岩石场，稳稳落地。人类的一大步，是踩在 15 秒的余量上迈出去的。"],"0721":["月球上的「到此一游」","阿波罗十一号在月球留下一块牌子：「公元 1969 年 7 月，来自地球的人类在此首次踏上月球。」下面还留了三个签名，外加尼克松的。有人调侃：史上最高海拔的「到此一游」，还没法撕。"],"0722":["一场比赛的规则","1894 年 7 月 22 日，世界第一场汽车赛在巴黎举行，赛程是巴黎到鲁昂，一百二十六公里。参赛车有蒸汽的、汽油的、电动的。冠军是一辆蒸汽牵引车，平均时速只有十九公里。组织者说：「我们证明了，车能跑。」"],"0723":["彗星的两个发现者","1995 年 7 月 23 日，海尔-波普彗星被发现。两位发现者是分别独立看到的，一位在美国，一位在台湾。这颗彗星亮度极高，肉眼可见近两年，被称为「世纪彗星」。它下一次回归，大约在四千年后。"],"0724":["一座城，藏在云里","1911 年 7 月 24 日，美国探险家宾厄姆在当地农民带领下，登上安第斯山脊，看见马丘比丘的废墟。他在日记里写：「这座城在云里，几乎没有任何人知道它。」其实当地农民一直都在那里种地。"],"0725":["试管婴儿的「首秀」","1978 年 7 月 25 日，世界第一个试管婴儿路易丝·布朗出生。当时有人担心她「不正常」，结果她健康长大、结婚生子。如今全球已有上千万试管婴儿。科学的每一步，都是从「有人担心」开始的。"],"0726":["那场起义的名字","1953 年 7 月 26 日，卡斯特罗率一百多人攻打古巴圣地亚哥的蒙卡达兵营。起义失败，大部分人被抓，卡斯特罗被判十五年。他在法庭上说：「历史将宣判我无罪。」五年后，他推翻了巴蒂斯塔政权。"],"0727":["一间小木屋里的停战","1953 年 7 月 27 日，朝鲜停战协定在板门店签字。签字仪式只用了十二分钟，双方代表没有握手，也没有说话。协议规定：停战而非和平，双方各后撤两公里，建立非军事区。这条线，至今仍在地图上。"],"0728":["三个星期后的那本书","1914 年 7 月 28 日，一战爆发。英国外交大臣格雷望着窗外说：「整个欧洲的灯火都熄灭了，我们有生之年看不到它重新亮起。」这句话后来被反复引用，成了对那一代人的预言。"],"0729":["一座门，等了三十年","1836 年 7 月 29 日，巴黎凯旋门落成。拿破仑 1806 年下令兴建，中途因帝国覆灭停工多年，他本人没能看见它完工。1840 年，拿破仑的灵柩从凯旋门下缓缓经过，数万人冒雪送行。设计者夏尔格兰没能等到这一天——他在四年前去世。"],"0730":["第一届世界杯的决赛","1930 年 7 月 30 日，第一届世界杯决赛，乌拉圭对阿根廷。上半场阿根廷领先，下半场乌拉圭连进三球，最终 4:2。赛后，乌拉圭全国放假，蒙得维的亚的港口鸣笛一整天。有一名球员说：「我们不是在踢球，是在打仗。」"],"0731":["他驾机飞向了太阳","1944 年 7 月 31 日，圣埃克苏佩里驾侦察机从科西嘉起飞，再没回来。他的《小王子》写于流亡纽约时，扉页上写：「请孩子们原谅我，我把这本书献给了一个大人。」六十多年后，有人在地中海找到他的飞机残骸。"],"0801":["那一天的枪声","1927 年 8 月 1 日，南昌起义。起义部队当时打的还是国民革命军的旗号。后来有人回忆：「那天晚上很热，大家把袖子挽起来，手臂上系红布条。」这支队伍后来上了井冈山，成了一个军队的起点。"],"0802":["那一天的凌晨两点","1990 年 8 月 2 日凌晨两点，伊拉克军队越过边界进入科威特，十几个小时后占领首都。两国此前为石油价格和债务吵了几个月，谈崩了。几个月后，多国部队把伊军逐出科威特。这场战争留下了两个后果：制裁，和一整个地区此后三十年的不安。"],"0803":["他相信地球是圆的","1492 年 8 月 3 日，哥伦布从帕洛斯港出发，带着三艘船、九十个人，向未知的大洋驶去。出发前他跟船员说：「三天看不到陆地，我们就回头。」结果第二天就有人想哗变。他在日志里把航程少报了一些。"],"0804":["那晚的烛光","1875 年 8 月 4 日，安徒生去世。他在哥本哈根的一间小屋里，床边放着一本翻开的书。好友说，他最后一句话是「现在我要睡了」。他的葬礼上，丹麦国王和王后都来了，数万人沿街送别一个写童话的人。"],"0805":["第一根「跨洋网线」","1858 年 8 月 5 日，第一条跨大西洋电缆接通，英美互发了贺电。几周后电缆坏了，全世界安静了八年。1866 年才重新连上。人类第一次体验「断网」，距离手机的诞生还有一百年。"],"0806":["那朵蘑菇云下的一只表","1945 年 8 月 6 日，广岛原子弹爆炸。事后，有人在废墟里找到一只停在 8 点 15 分的手表，指针被高温熔在了一起。这座城市有十四万人死亡。三天后，长崎又遭轰炸。日本随后宣布投降。"],"0807":["他登顶时没带氧气","1978 年 8 月 7 日，意大利登山家梅斯纳尔无氧登顶珠峰。他后来回忆：「顶峰上什么也没有，只有风和雪。我待了二十分钟，忽然觉得很害怕，因为我知道，下山比上山危险十倍。」"],"0808":["东盟的「三页纸」","1967 年 8 月 8 日，五个东南亚国家在曼谷成立东盟，宣言只有三页。有评论家说，东盟最大的成就是「让战争不再发生」。一份三页纸的文件，干了五十年「劝架」的工作，效率惊人。"],"0809":["第二颗原子弹","1945 年 8 月 9 日，长崎被原子弹轰炸。投弹的飞机原定目标是另一座城市，因天气不好，改飞长崎。爆炸当天，长崎有七万多人死亡。当时的日本军方仍坚持战斗，直到天皇在御前会议上说：「我不能再让百姓受苦了。」"],"0810":["他也不知道会走到哪","1519 年 8 月 10 日，麦哲伦的船队从塞维利亚出发。他只有一条计划：向西，找香料群岛。船队有五艘船、两百七十人，谁也不知道前面是什么。三年后，只剩一艘船、十八个人回到西班牙。"],"0811":["停战那天的日本","1945 年 8 月 15 日，日本天皇的《终战诏书》通过广播播放。据说很多日本人在听到「玉音」后跪地痛哭。中国各地鞭炮齐鸣。在重庆，有记者记录：「满城的人涌上街头，把帽子扔向天空。」"],"0812":["薛定谔的猫：一只被耽误的猫","1935 年，薛定谔设计「猫在盒子里既是死的也是活的」的思想实验，本意是嘲讽量子力学太荒谬。结果大家记住了猫，忘了他原本要吐槽什么。这只猫成了科学史上最著名的「受害者」，一躺就是九十年。"],"0813":["那堵墙建了二十八年","1961 年 8 月 13 日，柏林墙开始修建。一夜之间，铁轨被切断，人们醒来发现街道被铁丝网隔开。有丈夫在墙的西侧，妻子在东侧，隔着墙扔东西。这堵墙存在了二十八年，1989 年被推倒。"],"0814":["那天晚上的广播","1945 年 8 月 14 日，日本政府照会同盟国，接受《波茨坦公告》。当晚，美国记者在华盛顿听到消息，冲进杜鲁门办公室，总统正在喝酒。他说：「我最关心的是，从此再不要有战争了。」"],"0815":["中国最热闹的一天","1945 年 8 月 15 日，日本宣布无条件投降。延安的街头，锣鼓、秧歌一直闹到半夜。有人把被子当旗子挂出来，有人哭着笑。一位记者的报道里写：「中国人从没这样哭过，也从没这样笑过。」"],"0816":["一个国王的嗓音","1977 年 8 月 16 日，猫王普雷斯利被发现死于雅园。他死时 42 岁，浴室的浴室门口，书还摊开在地上。当天下午，上千人聚集在雅园门口。有人说：「那一年，美国的年轻人第一次觉得自己老了。」"],"0817":["独立日的一把椅子","1945 年 8 月 17 日，印尼宣布独立。苏加诺在自家门口宣读宣言，念完后，有人递给他一面旗子，是匆忙缝起来的。独立日的庆祝会是在院子里开的，只有几十人参加。荷兰在四年后才承认这个国家。"],"0818":["二十五万人站在台阶上","1963 年 8 月 28 日，马丁·路德·金在林肯纪念堂前发表《我有一个梦想》。他原本只准备了四分钟，结果讲了十六分钟。他后来对助手说：「我本来打算说『现在不是谈梦想的时候』，可是我感觉到了那个声音。」"],"0819":["一张照片的诞生","1839 年 8 月 19 日，法国政府公布达盖尔摄影法，称「这是给全世界的礼物」。达盖尔的照片拍得极慢，要曝光几分钟。第一批肖像照的人必须坐在金属支架上，一动不能动。有人说：「摄影是凝固的牢笼。」"],"0820":["一首序曲的代价","1882 年 8 月 20 日，《一八一二序曲》在莫斯科救世主大教堂落成典礼上首演。柴可夫斯基并不喜欢这个题目，说：「我写的不过是一首又吵又响的曲子。」可它里面有真正的炮声——首演时，教堂的钟和加农炮都响了。"],"0821":["《蒙娜丽莎》的「偷窃营销」","1911 年 8 月 21 日，《蒙娜丽莎》在卢浮宫被盗。两年后画找回来了，名声反而传遍全球。有评论说：这次偷窃是艺术史上最成功的「免费广告」。卢浮宫没生气，毕竟看展的人翻了一倍。"],"0822":["红十字会的第一面旗","1864 年 8 月 22 日，首个《日内瓦公约》签署，规定战时伤兵要受到保护。旗子的标志是白底红十字，据说是为了纪念瑞士——把瑞士的国旗颜色反过来，就成了这个标志。土耳其后来用红新月代替，至今仍是认可的标志。"],"0823":["一份协议，和两年的时间","1939 年 8 月 23 日，《苏德互不侵犯条约》签署。签约现场，斯大林举起酒杯，说：「为德国的健康干杯。」希特勒用这份条约换到了进攻波兰的时间。两年后，德国调转枪口，越过了那条「互不侵犯」的线。"],"0824":["庞贝的「最后涂鸦」","公元 79 年 8 月 24 日，维苏威火山埋了庞贝。考古学家在墙上发现一句涂鸦：「这儿什么都有，就是没有爱情。」两千年前的人类，吐槽水平和今天一模一样。灾难毁掉了一座城，却留下了一句实话。"],"0825":["伽利略的第一次「卖望远镜」","1609 年 8 月 25 日，伽利略向威尼斯的议员们演示了他的望远镜。他把镜片调好，让议员们轮流看远处的钟楼。议员们看见楼上的人，纷纷叫好。第二天，他的薪水翻了一倍。他用这个装置赚了钱，也改变了天文史。"],"0826":["一份宣言的两百多年","1789 年 8 月 26 日，法国国民议会通过《人权宣言》，全文只有十七条。第一句是「人人生而自由，在权利上始终平等」。这份文件后来成了法国宪法的序言，也被写进了联合国的《世界人权宣言》。"],"0827":["一场听不见的爆炸","1883 年 8 月 27 日，喀拉喀托火山爆发，声音传到四千八百公里外，是历史上听到过的最大的自然声音。据说那天上午，在澳大利亚西部，人们听见了「远处大炮的声音」。爆炸引起的海啸，淹死了三万多沿岸居民。"],"0828":["一句被讲了许多遍的话","1963 年 8 月 28 日，马丁·路德·金演讲结束后，有人问他：「你那时是在念稿吗？」他说：「我只记得自己讲了一半，忽然所有人都在喊。」这篇演讲的录音，后来被保存在美国国会图书馆。"],"0829":["一个机械师的两个轮子","1885 年 8 月 29 日，戴姆勒为他造的一辆「摩托车」申请了专利。那辆车像一辆木头做的自行车，装着一台单缸发动机，时速 12 公里。他的儿子第一次试骑，骑了六公里，过河时轮子卡在泥里，只好推回来。"],"0830":["他靠「数粒子」看世界","1871 年 8 月 30 日，卢瑟福出生在新西兰的农场。他后来提出原子核模型，被称作「原子物理之父」。他说：「所有的科学，要么是物理，要么是集邮。」他的学生玻尔，后来把这句话传给了下一代。"],"0831":["那束花，和那辆车","1997 年 8 月 31 日，戴安娜王妃在巴黎车祸中身亡。出事前，她为躲避狗仔队，钻进一辆奔驰，车穿过枫丹白露隧道。之后数日，肯辛顿宫门口堆满鲜花。有人说：「她活着时，被相机追着跑；她死后，相机才停下。」"],"0901":["邮戳上的历史","1939 年 9 月 1 日，德国入侵波兰，二战爆发。但泽港的德国训练舰向波兰基地开火，打响了第一炮。舰上的年轻水兵后来回忆：「我们以为是演习。」人类的悲剧，常常从一场「误会」开始。"],"0902":["签字的那一天","1945 年 9 月 2 日，日本在密苏里号战舰上签署投降书。仪式只用了二十三分钟。签字用的十支笔是特制的，由美方留作纪念，其中一支送给了西点军校，一支送给了杜鲁门的秘书。海上那天，天气灰沉。"],"0903":["那口钟的名字","1945 年 9 月 3 日被定为抗战胜利纪念日。2014 年，辽宁的沈阳「九一八」历史博物馆为这一天铸造了一口「警示钟」，每年九月撞钟十四响，象征十四年抗战。有老人说，那钟声听着像雷声，又像哭声。"],"0904":["柯达的「懒人发明」","1888 年 9 月 4 日，柯达推出第一台便携相机，口号是「你按快门，剩下的交给我们」。拍完寄回工厂，他们冲印好再寄回来。史上最早的「外包服务」，比你想象的早了一百多年。"],"0905":["一场奥运会的十一条命","1972 年 9 月 5 日，慕尼黑奥运会期间，巴勒斯坦武装分子闯入以色列代表团驻地，杀死了十一名以色列人。奥运会的比赛中断了一天，随后在体育场举行悼念仪式。有人说，那次之后，奥运会再也不是纯粹的运动。"],"0906":["环球航行的「幸存者名单」","1522 年 9 月 6 日，「维多利亚号」回到西班牙，完成人类首次环球航行。出发 270 人，回来 18 人。船员瘦得家人都认不出，货物卖掉刚好够还装备钱。史上第一次环球出差，人均「瘦成闪电」，还没奖金。"],"0907":["一场战役和一位作家","1812 年 9 月 7 日，波罗底诺战役爆发。托尔斯泰后来在《战争与和平》里花了二十页描写这一天。他到过战场，问一个老兵：「当时你怕吗？」老兵说：「怕，但大家都怕，就不怕了。」"],"0908":["《星际迷航》的「低收视逆袭」","1966 年 9 月 8 日，《星际迷航》首播，收视率平平，差点被砍。几十年后，它成了一代人的信仰，连 NASA 的工程师都说自己是看它入行的。史上最强「差生逆袭」，证明好作品需要时间发酵。"],"0909":["最后一份手稿","1976 年 9 月 9 日，毛泽东逝世。他生前读的最后一份文件，是关于唐山地震的灾情报告。据说他看得很慢，看完后流了泪，让人「一定要把人民的生活安排好」。那一年，中国经历了许多事。"],"0910":["他改了一个字","韩愈写《师说》，开头是「师者，所以传道受业解惑也」。原文里的「受」是「教授」的意思，不是「接受」。后来有人改成了「授」，意思才顺了。这篇文章被选入课本，一千多年里，无数孩子背过它。"],"0911":["九点四十六分","2001 年 9 月 11 日，两架飞机撞向纽约世贸中心，两座塔楼在不到两小时内倒塌。有一位消防员在楼梯间遇到一位坐轮椅的女士，和同事一起把她抬下楼，刚走出大门，楼就塌了。他们三个人都活着。"],"0912":["洞穴里的十七岁","1940 年 9 月 12 日，四个少年在法国南部的树林里追一条狗，狗钻进一个洞口。他们用灯照进去，看见岩壁上的野牛和鹿——那是距今一万七千年前的画。其中年纪最小的少年说：「我们进去的时候，那里还是黑的。」"],"0913":["他让人重新认识了大脑","1848 年 9 月 13 日，美国铁路工人盖奇被一根铁棍穿过头颅，居然活了下来。他的性格变了，变得暴躁、粗鲁。医生后来发现，受伤的是他的前额叶。从此，人类第一次知道，大脑的某一部分，管着人的性格。"],"0914":["但丁的葬礼","1321 年 9 月 14 日，但丁在拉文纳去世。他流亡十九年，至死未回佛罗伦萨。他的《神曲》写完了，却没能亲手交给故乡。佛罗伦萨后来多次请求归还他的遗骨，拉文纳一直拒绝。他至今还睡在那座小城。"],"0915":["一次不经意的停靠","1835 年 9 月 15 日，达尔文乘「小猎犬号」抵达加拉帕戈斯群岛。他在那里待了五周，收集了一批雀鸟标本。当时他没在意这些鸟的喙不一样，是后来鸟类学家告诉他：那些其实是不同的物种。这个细节，成了进化论的起点。"],"0916":["五月花号的旅程","1620 年 9 月 16 日，「五月花号」从普利茅斯出发，载着一百零二名乘客。船上没有牧师，他们自己签了一份《五月花号公约》，说「我们要建立一个公正平等的社会」。这份文件，被看作美国政治的起点。"],"0917":["四个月，和五十五个人","1787 年 9 月 17 日，美国制宪会议闭幕，五十五名代表中有三十九人签字。会议开了四个月，全部秘密进行，窗户都关着。有代表说：「这不是最好的宪法，但它可能是当时能写出来的最好的一部。」"],"0918":["那天晚上，沈阳的枪声","1931 年 9 月 18 日夜里，日军炸毁南满铁路一段路轨，反诬中国军队所为，随即进攻沈阳。驻军接到「不抵抗」命令，撤退。四个月后，东北全境沦陷。此后每年的这一天，沈阳都会鸣响防空警报。"],"0919":["一个签名和一张纸","1893 年 9 月 19 日，新西兰成为世界上第一个赋予女性选举权的国家。请愿书长达 270 米，有近三万二千个签名。当时反对者说：「女人投票，家庭就会破裂。」二十年后，新西兰出了一位女总理。"],"0920":["他推开了那扇门","1519 年 9 月 20 日，麦哲伦的船队从西班牙出发。他们把船头朝西，绕过南美洲，进入一片他们叫「太平洋」的海。麦哲伦说：「这片海太平静了。」他们航行了九十八天，没有遇到一场风暴。"],"0921":["开会那天，他们唱了什么","1949 年 9 月 21 日，中国人民政治协商会议第一届全体会议在北平开幕。会议通过了《共同纲领》，确定了国名、国旗、国歌。选国歌时有人主张改歌词，毛泽东说：「还是原来的好，居安思危。」"],"0922":["日夜平分的那天","「秋分」这天，太阳直射赤道，昼夜等长。古人说「秋分者，阴阳相半也」。农谚讲「秋分不生田」，秋收、秋耕、秋种都在这时。中国自 2018 年起设「中国农民丰收节」，日子就定在秋分。"],"0923":["「算」出来的一颗星","1846 年 9 月 23 日，天文学家伽勒根据勒维耶用数学推算的位置，找到了海王星。此前人类从没「用笔找到过一颗行星」。勒维耶没上过望远镜，只寄了一张纸条。史上最强「云指导」，纸上得来也照样真知。"],"0924":["一台机器的名字","1948 年 9 月 24 日，本田技研工业株式会社成立。创始人本田宗一郎出身铁匠家庭，起初把发动机装在自行车上卖。公司名里有个「技研」，意思是「技术研究所」——他坚持把「研究」写进公司名字。"],"0925":["他写的第一篇小说叫《怀旧》","1881 年 9 月 25 日，鲁迅出生在浙江绍兴。他少年时常去当铺典当东西，受尽白眼。他后来说：「有谁从小康人家而坠入困顿的么，我以为在这途路中，大概可以看见世人的真面目。」"],"0926":["电视辩论的第一回合","1960 年 9 月 26 日，肯尼迪与尼克松进行美国首次总统候选人电视辩论。收音机听众认为尼克松赢了，电视观众则认为肯尼迪赢了——他看起来更年轻、更镇定。有人说，从那天起，政治开始看脸。"],"0927":["一条铁路的开端","1825 年 9 月 27 日，世界第一条公共铁路在英国通车。开通那天，一辆火车头牵引着车厢，车上载着煤和面粉，还有一名骑马的人在前面引路。有人担心火车会让母鸡不下蛋，可铁路还是很快铺遍了世界。"],"0928":["一个被搁置了十年的发现","1928 年 9 月，弗莱明在培养皿里看见一圈「干净的」地方，写了篇论文就搁下了。青霉素太不稳定，提纯极难，他一个人做不出来。十年后，牛津的弗洛里和钱恩把它变成了药。1945 年，三个人一起领了诺贝尔奖。"],"0929":["一个实验室的诞生","1954 年 9 月 29 日，欧洲核子研究中心（CERN）成立。它由十二个国家共同出资，建在日内瓦郊外。有人说，这是「二战后欧洲最成功的和平工程」。五十年后，它的对撞机里跑出了万维网。"],"0930":["一张纸，和一场战争","1938 年 9 月 30 日，英国首相张伯伦从慕尼黑回来，举着一纸协定说：「我带来了我们时代的和平。」一年后，德国入侵波兰。有人后来说：那张纸不是和平，是把战争推迟了一年。"],"1001":["开国大典的「两遍飞机」","1949 年 10 月 1 日，开国大典受阅飞机只有十七架，数量不够壮观，有的飞机飞过天安门后绕一圈再飞一遍。周总理说：「飞机不够，就飞两遍。」这句务实又心酸的安排，如今成了最动人的历史注脚。"],"1002":["「非暴力」是怎么来的","甘地在南非当律师时，因为肤色被赶下火车。他在车站坐了一整夜，第二天决定：不还手，但也不退让。他后来把这种方法叫「坚持真理」。他说：「以眼还眼，世界只会更盲目。」"],"1003":["统一那天，他们没放烟花","1990 年 10 月 3 日，两德统一。柏林墙倒了一年，但东西德之间的隔阂还在。统一当晚，有人在勃兰登堡门前哭，也有人沉默。有东德作家说：「我们得到了一个国家，却失去了一个故乡。」"],"1004":["「滴滴」声吓坏美国","1957 年 10 月 4 日，苏联发射人类第一颗人造卫星「斯普特尼克一号」，直径五十八厘米，每天绕地球转，发出「滴滴」声。美国的收音机爱好者整夜守着听。一颗铁球加四根天线，让一个超级大国失眠了。"],"1005":["第一次录音时，他们在笑","1962 年 10 月 5 日，披头士发行首支单曲《Love Me Do》。录音时，制作人嫌鼓手打得太差，临时换了一个。这首歌只卖了不到两千张。八年后，同一支乐队解散，全世界都在为他们惋惜。"],"1006":["那场战争打了十九天","1973 年 10 月 6 日，第四次中东战争爆发。埃及和叙利亚在赎罪日突袭以色列，初期占了上风。十九天后停火。这场战争让世界第一次感受到「石油武器」的力量，也让油价在几个月里翻了四倍。"],"1007":["第一次看见月球背面","1959 年 10 月 7 日，苏联「月球三号」拍下人类第一张月球背面照片。照片很模糊，但足以证明：背面和正面不一样，几乎没有「海」。当时有人开玩笑说：「月亮把脸背过去，是不想让我们看见。」"],"1008":["一场火的起点","1871 年 10 月 8 日，芝加哥大火。传说是一头牛踢翻了油灯，但历史学家后来否定了这个说法。火烧了三天，毁了三分之一的城市。有意思的是，重建让芝加哥成了现代摩天大楼的发源地。"],"1009":["列侬的「一句话风波」","1966 年，列侬说披头士「比耶稣更受欢迎」，美国南部掀起抵制潮，电台禁播、唱片被当街烧毁。他道歉说「我不是那个意思」。一句话引发的火烧了半个美国——说话的艺术，艺人比谁都懂。"],"1010":["第一枪与一张「床」","1911 年 10 月 10 日，武昌起义。当晚新军工程营的士兵打响了第一枪。第二天，起义者找到黎元洪，要他当都督，他躲在床底下不肯出来，被拖出来时还在发抖。后来他成了民国的副总统。"],"1011":["他把窗户打开了","1962 年 10 月 11 日，梵蒂冈第二届大公会议开幕。教皇约翰二十三世说：「我们要把窗户打开，让新鲜空气进来。」会议持续了三年，允许用本地语言做弥撒，天主教从此走向现代。"],"1012":["哥伦布的「方向感」","1492 年 10 月 12 日，哥伦布登上美洲，但他到死都以为自己到的是印度。所以加勒比海群岛被叫作「西印度群岛」，当地人叫「印第安人」。史上最强「路痴」，错得让全世界跟着叫了两百个国家的名字。"],"1013":["时间从此有了起点","1884 年 10 月 13 日，国际会议决定以格林尼治为经度起点。此前，每个城市用自己的时间，火车站牌上有好几个钟。美国铁路公司最先推行「标准时间」，他们关心的不是科学，而是别让火车撞上。"],"1014":["黑斯廷斯的九小时","1066 年 10 月 14 日，黑斯廷斯战役打了九个小时。英王哈罗德战死，据说被一箭射中眼睛。诺曼底公爵威廉成为英格兰国王。此后三百年，英国宫廷说法语。英语里那些「牛肉、猪肉」都来自法语，「牛、猪」才是本土词。"],"1015":["他抱着马脖子哭","1889 年，尼采在都灵街头看见一个马车夫抽打一匹马，他冲上去抱住马的脖子，然后昏倒。此后十一年，他精神失常，由母亲和妹妹照顾。他死时，他的书还没卖完，可二十年后，整个欧洲都在读他。"],"1016":["断头台前的那句话","1793 年 10 月 16 日，玛丽·安托瓦内特被送上断头台。她走上台阶时踩到了刽子手的脚，说了一句「对不起，我不是故意的」。这句话被记录在案，后来有人感叹：一个被指为「奢侈」的王后，最后一句话是对一个刽子手道歉。"],"1017":["爱因斯坦的「行李」","1933 年 10 月 17 日，爱因斯坦逃离德国抵达美国，全部行李是两个箱子：几件衣服和一把小提琴。有人问他为什么带走小提琴，他说：「我需要它。」史上最简朴的「人才引进」，带来的是相对论。"],"1018":["一张旧收据","1867 年 10 月 18 日，美国从俄国手中接收阿拉斯加。当时被讥为「苏华德的冰箱」，因为主持这笔交易的国务卿叫苏华德。七百万美元买了一百七十万平方公里土地，每平方公里两块多美元。后来那里发现了石油和黄金。"],"1019":["投降的那天，乐队在奏乐","1781 年 10 月 19 日，英军在约克镇投降。英军走出阵地时，军乐队奏起一首当时的流行曲《世界颠倒过来了》。美军接受投降，却拒绝让英军的旗子垂下——他们说，那是屈辱，我们不做。"],"1020":["写诗写到十九岁的人","1854 年 10 月 20 日，兰波出生。他十九岁就写完了一生中大部分的诗，然后停笔，去非洲做军火生意。他临终前说：「我的一生，是一场梦。」他的诗集影响了一代又一代人，包括所有后来的诗人。"],"1021":["诺贝尔的「赎罪基金」","1833 年 10 月 21 日，诺贝尔出生。他发明炸药发了财，也目睹弟弟死于实验。临终前他把九成四的遗产设成奖金，说「奖不分国籍」。史上最著名的「遗产处理」，每年都在提醒世界：他留下的不只是炸药。"],"1022":["差一点触发的按钮","1962 年 10 月 22 日，肯尼迪公开宣布苏联在古巴部署导弹。随后几天，美苏的军舰在海上对峙。据后来解密的档案，有一艘苏联潜艇的舰长以为战争已经爆发，准备发射核鱼雷——被副舰长拦住了。"],"1023":["布达佩斯的十月","1956 年 10 月 23 日，布达佩斯的市民走上街头，推倒了斯大林像。起义持续了十几天，最后被苏军镇压。有记者记下了街上的一个细节：人们把国旗中间剪掉，只剩下一个带洞的旗子——那是他们自己的国徽。"],"1024":["四十六个国家，一张纸","1945 年 10 月 24 日，联合国宪章生效。此后的七十多年里，联合国没有阻止过所有的战争，但它让「大使馆」成为一种职业。有人评价：「联合国的真正作用，是让对手能坐在一起说话。」"],"1025":["毕加索的「重启人生」","1881 年 10 月 25 日，毕加索出生。他十三岁时，画家父亲看他的画，默默放下画笔说：「我不画了。」毕加索后来用五万多件作品证明父亲是对的，又说：「我花了半辈子才学会像孩子那样画画。」"],"1026":["世界上最可爱的小宝宝诞生了","1981 年 10 月 26 日，世界上最可爱的小宝宝丫丫来到这个世界。从那天起，历史书上又多了一件值得纪念的大事——她让身边的每一天都更开心了一点。祝丫丫生日快乐🎂，愿她天天开心、年年可爱，往后的每个 10 月 26 日都笑声不断！"],"1027":["第一列地铁里的味道","1904 年 10 月 27 日，纽约地铁通车，票价五分钱。第一天有十多万人乘坐。车厢里挤得像沙丁鱼，有人抱怨空气太闷。可第二天，人们还是排着队来坐——因为它是当时最快的方式。"],"1028":["自由女神的「瘦」","1886 年 10 月 28 日，自由女神像落成。她的铜皮只有 2.4 毫米厚，比硬币还薄，内部靠一座铁塔撑着——设计者正是埃菲尔。也就是说，这座美国的象征，用的是「法国骨架」。跨国合作的典范，从一尊雕像开始。"],"1029":["华尔街的「哭声」","1929 年 10 月 29 日，美股崩盘，史称「黑色星期二」。有经纪人回忆：「有人蹲在楼梯上哭，我从没听过那种声音。」此后全世界进入大萧条。金融史上最贵的一课：牛市里没人相信冬天会来。"],"1030":["那个广播剧吓坏了美国","1938 年 10 月 30 日，奥森·威尔斯的广播剧《世界大战》播出，讲火星人入侵。节目用了新闻播报的形式，不少人信以为真，打电话到电台询问。第二天报纸登出头条，说「全国恐慌」。其实收视率并不高。"],"1031":["一个人的九十五条","1517 年 10 月 31 日，马丁·路德把《九十五条论纲》贴在教堂门口。他本意是学术辩论，反对的是「赎罪券」，不是要脱离罗马。可这份论纲被翻译、印刷、传遍欧洲。有人说，印刷机把一个人变成了一个时代。"],"1101":["他在脚手架上仰头四年","1512 年 11 月 1 日，西斯廷教堂天顶画揭幕。米开朗基罗画了四年，画出了三百多个人物。揭幕那天，聚在教堂里的人把脖子仰到发酸。有人问他为什么把上帝画得那么年轻，他说：「他是永恒。」"],"1102":["无线电的味道","1936 年 11 月 2 日，BBC 开始世界上第一个定期电视广播服务。第一天播出两小时，节目从「伦敦的天气」开始。一名观众后来回忆：「那会图像很小，还时常变黑，但我们全家都跪在屏幕前看。」"],"1103":["莱卡：一只上太空的小狗","1957 年 11 月 3 日，苏联把小狗莱卡送上太空——人类第一次把生命送入轨道。莱卡没能回来。几十年后，人们在莫斯科为它立了一座铜像。它替人类先走了一步，人类欠它一句谢谢。"],"1104":["台阶上的那句话","1922 年 11 月 4 日，考古学家卡特在帝王谷发现通向图坦卡蒙墓的台阶。他在日记里写：「起初只是一级台阶，然后是第二级。」三周后，他站在门前，从一个小洞往里看，借着手电的光说：「我看见了奇妙的东西。」"],"1105":["一个被记了四百年的夜晚","1605 年 11 月 5 日，英国「火药阴谋」败露。一群人计划在国会大厦地窖里埋下三十六桶火药，炸死国王。一封匿名信让计划败露。此后每年这一天，英国人都要烧掉一个叫盖伊·福克斯的假人。"],"1106":["一票之差","1860 年 11 月 6 日，林肯当选总统。其实他在南部的十个州，一张票也没得到，得票率不到百分之四十。但北部的选举人票足够了。南方各州听闻消息，开始讨论退出联邦。内战在四个月后爆发。"],"1107":["两个「十月」","1917 年 11 月 7 日（俄历 10 月 25 日），十月革命爆发。「阿芙乐尔号」巡洋舰发炮做信号，起义者冲进冬宫。因为俄国当时用旧历，所以这个「十一月」的革命叫「十月革命」。这成了历史书上一个有趣的错位。"],"1108":["他把它叫做「X」","1895 年 11 月 8 日，伦琴发现了 X 射线。他把手放在感光板上，看见了骨头。他给这个新射线取名叫「X」，意思是「未知」。他没有申请专利。六年后，他因此获得第一届诺贝尔物理学奖。"],"1109":["柏林墙的「口误」","1989 年 11 月 9 日，东德官员在发布会上念错一句答复，把「明天生效」说成「立即生效」。当晚几万人涌向检查站，边检官手足无措，只好开门。一堵修了二十八年的墙，被一次口误拆了。"],"1110":["「我想您就是利文斯通博士吧」","1871 年 11 月 10 日，记者斯坦利在坦噶尼喀湖边找到失联多年的探险家利文斯通。他拨开人群，说了那句著名的开场白。后来有人问他当时怎么想的，他说：「我准备了十年，就为了这句话。」"],"1111":["停战的「十一分十一秒」","1918 年 11 月 11 日上午 11 点，一战停火。有士兵记录，那一刻战场忽然安静，静得不习惯。几小时后，双方开始交换香烟。战争结束的方式，有时候不是欢呼，是「忽然安静」。"],"1112":["孙中山的四个字","1866 年 11 月 12 日，孙中山出生在广东香山的农家。他十三岁随母亲去檀香山，第一次看见轮船和西式学校。他后来说：「我那时才知道，世界不只是翠亨村。」他一生题写最多的四个字，是「天下为公」。"],"1113":["他撕掉了一半","1886 年，史蒂文森的《化身博士》出版。他是用几天时间写完的，最初版本写了一个月。他妻子看完说：「比原来的好多了。」于是他把第一版一把火烧掉了。这本书成了「双重人格」的经典。"],"1114":["他画了一池睡莲","1840 年 11 月 14 日，莫奈出生。晚年他在吉维尼的花园里挖了一个池塘，种了睡莲，然后画了三十多年。他晚年患白內障，颜色越画越偏蓝。有人问他为什么还画，他说：「我看见了光。」"],"1115":["一台看不见远方的望远镜","1738 年 11 月 15 日，赫歇尔出生在德国汉诺威。他本是个乐师，为转行做天文，自学磨镜。磨一面镜要花几百小时，手磨破了就包块布继续。他用自制望远镜发现了天王星，成了英国皇家天文学家。"],"1116":["他给自己划了一条线","1945 年 11 月 16 日，联合国教科文组织成立。宪章第一句是：「战争起源于人之思想，故务需于人之思想中筑起保卫和平之屏障。」这句话，在今天看来依然像一句提醒。"],"1117":["十二月，和一条河","1869 年 11 月 17 日，苏伊士运河通航。它长 163 公里，把欧洲到亚洲的航程缩短了七千公里。有人算过，运河开通后，从伦敦到孟买的时间从三个月缩短到三周。英国的舰队从此可以更快抵达东方。"],"1118":["米老鼠的「改名风波」","1928 年 11 月 18 日，米老鼠第一次在银幕上说话。它本来叫「莫蒂默」，是迪士尼妻子建议改成「米奇」的。也就是说，全球最值钱的老鼠的名字，是老板娘随口改的。史上最成功的一次「家庭内部意见」。"],"1119":["两分十七秒","1863 年 11 月 19 日，林肯在葛底斯堡发表演说，只讲了两分多钟、二百七十二个词。有人说他讲得太短了，不配这个场合。可今天，那场演讲的其他人的两小时讲话，都没人记得了。"],"1120":["法庭上的二十一名被告","1945 年 11 月 20 日，纽伦堡审判开庭。二十一名纳粹高层坐在被告席上。审判持续了十个月，控方的证据文件有几十万份。有一位法官后来说：「我们不是在审判一个国家，我们是在审判一种行为。」"],"1121":["一只羊、一只鸭和一只鸡","1783 年 11 月 21 日，法国人第一次乘热气球升空，吊篮里还有一只羊、一只鸭和一只鸡。气球飞了八分钟，落在两公里外。三只动物都活着。国王路易十六原本想用死刑犯做实验，后来改成了动物。"],"1122":["那天，广播里在放什么","1963 年 11 月 22 日，肯尼迪在达拉斯遇刺。当天下午，全美的电视台连续播了四天新闻，第一次实现了不间断报道。有人说：「那四天，电视成了全国人的客厅。」"],"1123":["十秒钟，和一辆车","1963 年 11 月 23 日，《神秘博士》在英国首播。这部剧一播就是几十年，主角换了十几任。英国人说：「这是我们国家的另一种宗教。」它讲述一个时间旅行者，永远在拯救世界，却总是孤独的。"],"1124":["达尔文的「拖延症」","1859 年 11 月 24 日，《物种起源》出版，第一版当天卖完。达尔文写它用了二十年，一直不敢发表，怕被骂。朋友催了又催，他才出版。史上最有价值的「拖延症」，拖出了一场科学革命。"],"1125":["五天，和一场日食","1915 年 11 月 25 日，爱因斯坦向普鲁士科学院提交广义相对论场方程。四年前，他预言光线在太阳附近会弯曲。1919 年日食观测证实了这一点，他一夜之间成了家喻户晓的人。"],"1126":["一张墓室里的照片","1922 年 11 月 26 日，卡特进入图坦卡蒙墓室。他们看到的是一个堆满物品的房间：黄金椅子、香料罐、一辆拆开的战车。卡特后来回忆：「我用手电照过去，光落在金色的墙面上，像是照进了一个梦。」"],"1127":["诺贝尔的「三十一字遗嘱」","1895 年 11 月 27 日，诺贝尔立下遗嘱，用遗产设立五个奖项。家族反对、机构推脱，差点没执行成。五年后第一届诺贝尔奖颁发。史上最著名的遗嘱，作者本人没能看到第一届颁奖——但全世界替他记着。"],"1128":["在太平洋上迷路的船","1520 年 11 月 28 日，麦哲伦的船队穿过海峡，进入太平洋。他们不知道这片海有多大，航行了九十八天。船员吃的是发臭的饼干和牛皮带。麦哲伦说：「我们吃的是船上的木头。」"],"1129":["那天的南极点","1929 年 11 月 29 日，美国探险家伯德飞越南极点。飞机在极点上方盘旋，伯德扔下一面美国国旗。他在日记里写：「我看见了什么？什么也没有，只有雪和天地。」"],"1130":["一次投河，和两个名字","1835 年 11 月 30 日，马克·吐温出生，本名塞缪尔·克莱门斯。他的笔名来自密西西比河上的行话「mark twain」，意思是水深两寻。他在河上做了几年领航员，晚年说：「我一生中所有的知识，都是从那条河上学的。」"],"1201":["罗莎·帕克斯的「不累，但烦了」","1955 年 12 月 1 日，罗莎·帕克斯拒绝在公交车上给白人让座。有人问她是不是累了，她说：「不是，我只是厌倦了屈服。」一场三百八十一天的抗争，从一位裁缝的「今天不想让座」开始。"],"1202":["一支笔、一本书","1804 年 12 月 2 日，拿破仑在巴黎圣母院加冕。仪式上，他从教皇手中拿过皇冠，自己戴上了，然后给妻子也戴了一顶。教皇坐在旁边，脸色很难看。拿破仑说：「我要让人们记住，这一切是我自己挣来的。」"],"1203":["那个心脏在胸前跳动","1967 年 12 月 3 日，南非医生巴纳德完成了世界首例心脏移植手术。患者醒来后问：「我的心还在吗？」医生答：「那是一颗新的。」患者活了十八天。第二例手术的病人活了十八个月。"],"1204":["小仲马的五天","1848 年，小仲马把与一位名妓的真实经历写成小说《茶花女》，只用了一个月。女主角死时才二十三岁。他把它改编成话剧，第一场散场时，有人看见台下的观众在哭。几十年后，威尔第把它写成了歌剧。"],"1205":["迪士尼的「被辞退」","1901 年 12 月 5 日，华特·迪士尼出生。年轻时他在堪萨斯一家广告公司画卡通，被辞退，理由是「缺乏想象力」。他后来造了一个迪士尼王国。史上最著名的「辞退信」，被历史狠狠打脸。"],"1206":["第一句被录下的人声是什么","1877 年 12 月 6 日，爱迪生录下并回放了人声，那是他自己念的《玛丽有只小羊羔》。回放时，那些在场的人都惊呆了。爱迪生说：「我没有发明声音，我只是让声音学会了记住自己。」"],"1207":["那天的收音机","1941 年 12 月 7 日，珍珠港被袭。美国广播中断了常规节目，主持人反复念同一段话。当晚，纽约的一家餐馆里，有客人站起来说：「我们该走了。」第二天，征兵站门口排起了长队。"],"1208":["一首歌和一个纽约的冬夜","1980 年 12 月 8 日，列侬在纽约达科他公寓门口被歌迷开枪打死。几小时前，他还给这个歌迷签了名。数万人聚集在中央公园，唱《想象》。那块地方后来被命名为「草莓园」，地上画了一个圆形的马赛克。"],"1209":["第一盏红绿灯","1868 年 12 月 9 日，伦敦议会大厦前安装了世界上第一盏交通信号灯，用煤气灯照明，红绿两色，由警察手动操作。一个月后，灯爆炸了，炸伤了操作的警察。红绿灯因此停了六十年，直到电气化后才重新上路。"],"1210":["第一届诺贝尔奖的「漏网之鱼」","1901 年 12 月 10 日，第一届诺贝尔奖颁发。爱因斯坦没在名单上——那年他还在专利局当小职员，相对论刚写完还没人看懂。史上最著名的「评委失误」，好在诺奖第二年就来补票了。"],"1211":["一纸退位","1936 年 12 月 11 日，英王爱德华八世宣布退位，理由是「为了能和所爱的女人结婚」。他在广播讲话里说：「我放下王冠，但我没有放下责任。」他和辛普森夫人后来一直住到老，据说她从没叫过他「陛下」。"],"1212":["一件龙袍","1915 年 12 月 12 日，袁世凯宣布接受帝制，改次年為「洪宪元年」。他穿上龙袍拍照，据说花了几万两银子。八十三天后，他在全国反对声中取消帝制。有人在他死后写了一副对联：「袁世凯千古，中华民国万岁。」"],"1213":["那六周","1937 年 12 月 13 日，南京沦陷。此后六周，三十万同胞遇难。有西方传教士在日记里记录了那些日子，说「每天都是噩梦」。2014 年，中国将这一天定为国家公祭日。每年 12 月 13 日上午，南京城响起警报。"],"1214":["他写下一行字","1911 年 12 月 14 日，阿蒙森抵达南极点。他在日记里写：「我们到达了，目标实现。」他的队伍是五个挪威人、十八只狗。他们的营地晚上升起了国旗。五年后，斯科特也在南极点插上了英国旗，但他没能回来。"],"1215":["那场首映，只放了一遍","1939 年 12 月 15 日，《乱世佳人》在亚特兰大首映。由于种族隔离法案，黑人演员不能参加首映礼，也不能进电影院看电影。饰演保姆的麦克丹尼尔后来获了奥斯卡，却不能坐在白人演员中间。"],"1216":["贝多芬的「木棒听力法」","1770 年 12 月 16 日，贝多芬出生。他四十四岁时几乎全聋，用牙咬住木棒抵在琴上，靠震动感受音符，写出了《第九交响曲》。他说过一句狠话：「我要扼住命运的咽喉。」命运后来确实被他掐得够呛。"],"1217":["十二秒的飞行","1903 年 12 月 17 日，莱特兄弟完成人类首次动力飞行，飞了十二秒、三十六米——比一架波音 747 的翼展还短。当天最长一次飞了五十九秒。十二秒，够人类从「不可能」滑到「原来可以」。"],"1218":["一个叫「科巴」的人","1878 年 12 月 18 日，斯大林出生在格鲁吉亚的戈里。他少年时学的是神学，后来从事革命，化名「科巴」，取自格鲁吉亚小说里的一位英雄。他一生用过几十个化名，「斯大林」是其中之一，意思是「钢铁的」。"],"1219":["一本书，和一场雾","1843 年 12 月 19 日，狄更斯的《圣诞颂歌》出版。他写这本书只用了六周，因为急需还债。书出版后，很多人开始给穷人送礼物，有人说是这本书让圣诞节重新成为「温暖的节日」。"],"1220":["整个国家的买卖","1803 年 12 月 20 日，美国从法国手中买下路易斯安那，总价一千五百万美元，让美国的国土面积翻了一倍。拿破仑卖地是为了筹钱打仗。有人评价：「这笔交易是拿破仑一生中最大的失误。」"],"1221":["冬至大如年","古人说「冬至大如年」，这一天要祭祖、吃饺子或汤圆。从冬至开始「数九」，每九天算一个「九」。民间还画「九九消寒图」，一天涂一瓣梅花，八十一瓣涂完，春天就来了。"],"1222":["一部没写完的歌剧","1924 年 12 月 22 日，普契尼在布鲁塞尔去世。他当时写《图兰朵》，只写到第三幕。临终前，他对朋友说：「没有写完。」后来有人续完了。首演时，指挥演到普契尼停笔处，放下指挥棒，转身对观众说：「大师在这里停笔了。」"],"1223":["一块塑料的名字","1947 年 12 月 23 日，贝尔实验室第一次演示晶体管。它只有指甲盖大小，却取代了笨重的电子管。此后所有电子设备的基础都在这里。有时人们说，二十世纪分两段：晶体管之前，晶体管之后。"],"1224":["「地球升起」","1968 年 12 月 24 日，阿波罗八号绕月飞行。宇航员安德斯在月球背面看见了地球从月平线升起，拍下了那张「地球升起」的照片。他说：「我们本来要去探索月球，却发现了地球。」"],"1225":["查理曼的「被迫营业」","公元 800 年 12 月 25 日，查理曼在罗马被教皇加冕为帝。他后来抱怨：早知道教皇要来这出，那天就不进教堂了。史上最强「不想上班的老板」，被员工硬塞了一顶皇冠，还成了欧洲历史的分水岭。"],"1226":["一个农家孩子","1893 年 12 月 26 日，毛泽东出生在湖南湘潭韶山冲。他八岁进私塾，也下田干活、记家里的账。十七岁那年，他挑着行李去长沙读书，临行前在父亲账本上改写了一首诗夹在里面：「孩儿立志出乡关，学不成名誓不还。」"],"1227":["一个面包师与一个化学家","1822 年 12 月 27 日，巴斯德出生。他父亲是个制革匠，家里很穷。他后来发明了巴氏消毒法、狂犬疫苗。他说：「科学没有国界，科学家却有祖国。」"],"1228":["一百年前的电影","1895 年 12 月 28 日，卢米埃尔兄弟在巴黎大咖啡馆的地下室首次商业放映电影。票价一法郎，一天卖出两千多张。放映的是十几部一分钟的短片。那一天，人类第一次在黑暗里看见「活着的过去」。"],"1229":["一位大主教的死","1170 年 12 月 29 日，坎特伯雷大主教贝克特在教堂被国王的四名骑士杀死。此前，他与亨利二世争吵多年。据说国王曾喊过一句「谁来帮我摆脱这个教士」。三年后，贝克特被封圣，国王赤脚走到他的墓前认罪。"],"1230":["泰戈尔的「树下单招」","1861 年 12 月 30 日，泰戈尔出生在印度加尔各答。他一生写了五十多部诗集，还在自家院子办了所学校，让学生坐在树下上课。别的学校靠教学楼，他的学校靠一棵树——教学质量照样顶呱呱。"],"1231":["跨年夜的「千年虫」","1999 年 12 月 31 日，全世界都在等千禧年钟声，也在等「千年虫」病毒让电脑集体崩溃。结果零点一到，什么都没发生。人类为一场「不存在的灾难」花了数千亿美元。史上最贵的一场虚惊，好在白花钱总比真崩溃强。"]};

const daysIn = (y,m) => new Date(y, m, 0).getDate();
const idxOf = (m,d) => Math.round((new Date(2026,m-1,d) - new Date(2026,0,1))/86400000);

function lunarOf(m,d){
  const k = LUNAR[idxOf(m,d)];
  return k ? {month:k[0], day:k[1]} : {month:"",day:""};
}
function festOf(m,d){
  const lu = lunarOf(m,d);
  const lf = LUNAR_FEST[lu.month+"-"+lu.day] || "";
  return {solar: SOLAR_FEST[m+"-"+d] || "", lunar: lf, term: TERMS[m+"-"+d] || ""};
}
function zodiac(m,d){
  const s=[[1,20,"水瓶座"],[2,19,"双鱼座"],[3,21,"白羊座"],[4,20,"金牛座"],[5,21,"双子座"],
    [6,22,"巨蟹座"],[7,23,"狮子座"],[8,23,"处女座"],[9,23,"天秤座"],[10,24,"天蝎座"],
    [11,23,"射手座"],[12,22,"摩羯座"]];
  let r="摩羯座";
  for(const [mm,dd,n] of s){ if(m>mm || (m===mm && d>=dd)) r=n; }
  return r;
}
const yearText = y => y<0 ? "公元前"+Math.abs(y)+"年" : y+"年";
const yearShort = y => y<0 ? "前"+Math.abs(y) : String(y);

/* ============ 状态 ============ */
const NOW = new Date();
const TODAY = {m:NOW.getMonth()+1, d:NOW.getDate()};
let view = {m: TODAY.m};
let selected = {m: TODAY.m, d: TODAY.d};

/* ============ 渲染月历 ============ */
document.getElementById("weekdays").innerHTML =
  WD.map((w,i)=>`<span class="${i===0||i===6?'wk':''}">${w}</span>`).join("");

function renderCalendar(){
  document.getElementById("mTitle").textContent = MONTH_CN[view.m];
  document.getElementById("yTitle").textContent = "2026";
  const firstWd = new Date(2026, view.m-1, 1).getDay();
  const total = daysIn(2026, view.m);
  const prevM = view.m === 1 ? 12 : view.m-1;
  const prevTotal = daysIn(2026, prevM);
  const cells = [];
  for(let i=0;i<firstWd;i++) cells.push({m:prevM, d:prevTotal-firstWd+1+i, other:true});
  for(let d=1;d<=total;d++) cells.push({m:view.m, d, other:false});
  let nd = 1;
  const nextM = view.m === 12 ? 1 : view.m+1;
  while(cells.length % 7 !== 0) cells.push({m:nextM, d:nd++, other:true});

  document.getElementById("days").innerHTML = cells.map(c=>{
    const wd = new Date(2026, c.m-1, c.d).getDay();
    const isToday = c.m===TODAY.m && c.d===TODAY.d;
    const isSel = c.m===selected.m && c.d===selected.d;
    let sub="", fest="", red=false;
    if(!c.other){
      const lu = lunarOf(c.m,c.d);
      const f = festOf(c.m,c.d);
      sub = lu.day === "初一" ? lu.month : lu.day;
      fest = f.solar || f.lunar || "";
      if(!fest) fest = f.term;
      red = !!f.solar || !!f.lunar;
    }
    return `<button class="day ${c.other?'other':''} ${wd===0||wd===6?'wk':''} ${isToday?'is-today':''} ${isSel?'sel':''}"
      data-m="${c.m}" data-d="${c.d}">
      <span class="num">${c.d}</span>
      <span class="sub-info">${sub}</span>
      ${fest?`<span class="fest ${red?'red':''}">${fest}</span>`:'<span class="dot"></span>'}
    </button>`;
  }).join("");

  document.querySelectorAll("#days .day").forEach(b=>{
    b.addEventListener("click", ()=>{
      const m = +b.dataset.m, d = +b.dataset.d;
      if(m !== view.m) view.m = m;
      selected = {m,d};
      renderCalendar(); renderPanel();
    });
  });
}

/* ============ 渲染详情 ============ */
function renderPanel(){
  const {m,d} = selected;
  const data = CAL_DATA[key(m,d)] || {};
  const lu = lunarOf(m,d);
  const f = festOf(m,d);
  const wd = new Date(2026,m-1,d).getDay();

  document.getElementById("dDate").textContent = `${m}月${d}日`;
  document.getElementById("dWd").textContent = "星期" + WD[wd];

  const tags = [`<span class="tag">农历${lu.month}${lu.day}</span>`];
  if(f.solar) tags.push(`<span class="tag fest">${f.solar}</span>`);
  if(f.lunar) tags.push(`<span class="tag fest">${f.lunar}</span>`);
  if(f.term) tags.push(`<span class="tag">${f.term}</span>`);
  tags.push(`<span class="tag">${zodiac(m,d)}</span>`);
  document.getElementById("dMeta").innerHTML = tags.join("");

  let html = "";

  // 故事放在最上面
  const st = STORY[key(m,d)];
  if(st){
    html += `<div class="story">
      <div class="story-kicker"><i></i>今日小故事</div>
      <div class="story-title">${st[0]}</div>
      <div class="story-text">${st[1]}</div>
      <div class="story-foot"><span>据公开史料整理</span><span class="pick" id="pickStory">换一天试试 →</span></div>
    </div>`;
  }

  const evs = data.e || [];
  if(evs.length){
    html += `<div class="sec-title">这一天发生的事</div>` + evs.map(([y,tx,cat])=>`
      <div class="ev"><div class="yr">${yearShort(y)}</div>
      <div class="tx">${tx}${cat?`<span class="cat">${cat}</span>`:""}</div></div>`).join("");
  }
  const bs = data.b || [];
  if(bs.length){
    html += `<div class="sec-title">生卒与人物</div>` + bs.map(([y,tx])=>`
      <div class="ev"><div class="yr">${yearShort(y)}</div>
      <div class="tx">${tx}<span class="cat">人物</span></div></div>`).join("");
  }
  const qs = data.q || [];
  if(qs.length){
    html += `<div class="sec-title">可以抄下来的一句（装文艺用）</div>` + qs.map(([q,c])=>`
      <blockquote class="quote"><p>${q}</p><cite>—— ${c}</cite></blockquote>`).join("");
  }
  if(!html) html = `<div class="sec-title">这一天</div><p style="font-size:13px;color:#8d95a3;line-height:2">暂未收录条目。翻到别的日子看看，或者用「随手一翻」碰碰运气。</p>`;
  document.getElementById("panelBody").innerHTML = html;
  document.getElementById("panelBody").scrollTop = 0;

  const pk = document.getElementById("pickStory");
  if(pk) pk.onclick = ()=>{
    const m2 = 1 + Math.floor(Math.random()*12);
    const d2 = 1 + Math.floor(Math.random()*daysIn(2026,m2));
    view.m = m2; selected = {m:m2, d:d2};
    renderCalendar(); renderPanel();
  };
}

/* ============ 今日一读 ============ */
function renderTodayStrip(){
  const {m,d} = TODAY;
  const st = STORY[key(m,d)];
  let t = `<b>${m}月${d}日</b>　`;
  if(st) t += `<b>${st[0]}</b>　<span style="color:#3a4049">${st[1]}</span>`;
  document.getElementById("todayText").innerHTML = t;
}

/* ============ 交互 ============ */
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("on"), 2000);
}
document.getElementById("prevM").onclick = ()=>{ view.m = view.m===1?12:view.m-1; renderCalendar(); };
document.getElementById("nextM").onclick = ()=>{ view.m = view.m===12?1:view.m+1; renderCalendar(); };
document.getElementById("btnToday").onclick = ()=>{ view.m = TODAY.m; selected = {...TODAY}; renderCalendar(); renderPanel(); };
document.getElementById("btnRandom").onclick = ()=>{
  const m = 1 + Math.floor(Math.random()*12);
  const d = 1 + Math.floor(Math.random()*daysIn(2026,m));
  view.m = m; selected = {m,d};
  renderCalendar(); renderPanel();
  document.querySelector(".panel").scrollIntoView({behavior:"smooth", block:"nearest"});
};
document.addEventListener("keydown", e=>{
  if(e.key === "ArrowLeft") document.getElementById("prevM").click();
  if(e.key === "ArrowRight") document.getElementById("nextM").click();
});

document.getElementById("btnCopy").onclick = async ()=>{
  const {m,d} = selected;
  const data = CAL_DATA[key(m,d)] || {};
  const lu = lunarOf(m,d);
  const st = STORY[key(m,d)];
  let s = `【历史上的今天】${m}月${d}日 · 农历${lu.month}${lu.day}\n`;
  if(st) s += `\n■ ${st[0]}\n${st[1]}\n`;
  if((data.e||[]).length) s += `\n这一天发生的事：`;
  (data.e||[]).forEach(([y,tx])=>{ s += `\n· ${yearText(y)}，${tx}`; });
  (data.b||[]).forEach(([y,tx])=>{ s += `\n· ${yearText(y)}，${tx}`; });
  (data.q||[]).forEach(([q,c])=>{ s += `\n\n「${q}」\n—— ${c}`; });
  try{
    await navigator.clipboard.writeText(s);
    toast("已复制，可直接粘贴发给朋友");
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = s; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("已复制"); }catch(_){ toast("复制失败，请手动选择文字"); }
    ta.remove();
  }
};

/* ============ 分享卡片 ============ */
function buildCard(){
  const {m,d} = selected;
  const data = CAL_DATA[key(m,d)] || {};
  const lu = lunarOf(m,d);
  const f = festOf(m,d);
  const wd = new Date(2026,m-1,d).getDay();

  document.getElementById("scBig").textContent = `${m}.${d}`;
  document.getElementById("scLine").textContent = `星期${WD[wd]} · 农历${lu.month}${lu.day}`;
  document.getElementById("scLunar").textContent =
    [f.solar, f.lunar].filter(Boolean).join(" · ") || f.term || "二〇二六";

  const evs = (data.e||[]).slice(0,2);
  document.getElementById("scEvents").innerHTML = evs.map(([y,tx])=>`
    <div class="sc-ev"><div class="y">${yearShort(y)}</div><div class="x">${tx}</div></div>`).join("");

  const st = STORY[key(m,d)];
  document.getElementById("scStoryBox").style.display = st ? "block" : "none";
  if(st){
    document.getElementById("scStoryTitle").textContent = st[0];
    document.getElementById("scStoryText").textContent = st[1];
  }

  const q = (data.q||[])[0];
  document.getElementById("scQuoteBox").style.display = q ? "block" : "none";
  if(q){
    document.getElementById("scQuote").textContent = q[0];
    document.getElementById("scCite").textContent = "—— " + q[1];
  }
}

function loadHtml2Canvas(){
  return new Promise((res, rej)=>{
    if(window.html2canvas) return res();
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

async function showCard(){
  toast("正在生成卡片…");
  buildCard();
  try{
    await loadHtml2Canvas();
    const node = document.getElementById("shareCard");
    const canvas = await html2canvas(node, {scale:2, backgroundColor:"#f7f4ec", logging:false, useCORS:true});
    const url = canvas.toDataURL("image/png");
    document.getElementById("modalImg").src = url;
    document.getElementById("modalImg").dataset.url = url;
    document.getElementById("modal").classList.add("on");
    toast("卡片已生成，长按或点「保存图片」");
  }catch(e){
    console.error(e);
    toast("生成失败：请检查网络，或改用「复制这段文字」");
  }
}
document.getElementById("btnShareCard").onclick = showCard;
document.getElementById("btnShare2").onclick = showCard;
document.getElementById("btnCloseModal").onclick = ()=>document.getElementById("modal").classList.remove("on");
document.getElementById("modal").addEventListener("click", e=>{ if(e.target.id==="modal") e.target.classList.remove("on"); });
document.getElementById("btnDownload").onclick = ()=>{
  const url = document.getElementById("modalImg").dataset.url;
  if(!url) return;
  const a = document.createElement("a");
  a.href = url; a.download = `历史上的今天-${selected.m}月${selected.d}日.png`;
  document.body.appendChild(a); a.click(); a.remove();
};

/* ============ 初始化 ============ */
renderCalendar();
renderPanel();
renderTodayStrip();
</script>
</body>
</html>
